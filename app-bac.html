<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SMS Adda — Send</title>
<meta name="description" content="Send OTP messages through SMS Adda." />
<meta name="theme-color" content="#F4F1E8" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="SMS Adda" />
<meta name="format-detection" content="telephone=no" />
<meta name="robots" content="noindex, nofollow" />

<link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
<link rel="shortcut icon" href="/favicon/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
<link rel="manifest" href="/favicon/site.webmanifest" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
/* =========================================================
   SMS ADDA — brand tokens
   ========================================================= */
:root {
  --bg:       #F4F1E8;
  --bg-soft:  #EDE8DC;
  --ink:      #111111;
  --ink-soft: #333333;
  --accent:   #FF4D00;
  --neutral:  #E5E0D5;
  --signal:   #DFFF00;
  --muted:    #6b665c;
  --ok:       #1a7f37;
  --warn:     #b45309;
  --err:      #b91c1c;
  --line:     #d8d2c4;

  --border:   1px solid var(--ink);
  --border-2: 2px solid var(--ink);

  --gutter: clamp(10px, 2.2vw, 24px);
  --nav-h:  clamp(48px, 4.5vw, 58px);

  --font-display: "Space Grotesk", system-ui, -apple-system, sans-serif;
  --font-mono:    "IBM Plex Mono", ui-monospace, Menlo, monospace;

  --ease:     cubic-bezier(.2,.7,.2,1);
  --ease-out: cubic-bezier(.16,1,.3,1);
  --shadow-offset: clamp(4px, 0.5vw, 7px);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-display);
  font-size: clamp(14px, 0.4vw + 12px, 16px); line-height: 1.5;
  -webkit-font-smoothing: antialiased; display: flex; flex-direction: column;
  min-height: 100vh; min-height: 100svh; min-height: 100dvh;
}
img, svg { display: block; max-width: 100%; height: auto; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
a { color: inherit; text-decoration: none; }
input { font: inherit; color: inherit; }
::selection { background: var(--accent); color: #fff; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* =========================================================
   NAV — cream, matches the rest of the site
   ========================================================= */
.nav {
  flex-shrink: 0;
  background: rgba(244,241,232,.94);
  backdrop-filter: saturate(140%) blur(12px);
  -webkit-backdrop-filter: saturate(140%) blur(12px);
  border-bottom: var(--border);
  padding-top: env(safe-area-inset-top, 0px);
  position: relative; z-index: 50;
}
.nav__inner {
  max-width: 1700px; margin-inline: auto; padding: 0 var(--gutter);
  height: var(--nav-h); display: flex; align-items: center; gap: 10px;
}
.nav__brand {
  font-weight: 700;
  font-size: clamp(14px, 0.5vw + 12px, 18px);
  letter-spacing: -0.01em; flex-shrink: 0;
}
.nav__brand-accent { color: var(--accent); margin-left: 2px; }
.nav__back {
  margin-left: auto;
  font-family: var(--font-mono); font-size: clamp(10px, 0.7vw, 11px);
  letter-spacing: .14em; text-transform: uppercase;
  padding: 6px 12px; border: var(--border); min-height: 32px;
  display: inline-flex; align-items: center;
  transition: background .2s var(--ease), color .2s var(--ease);
}
.nav__back:hover { background: var(--ink); color: var(--bg); }

/* Status pill */
.status-pill {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em;
  text-transform: uppercase; padding: 5px 10px;
  border: 1px solid var(--muted); color: var(--muted);
  display: inline-flex; align-items: center; gap: 6px;
  transition: all .25s var(--ease);
}
.status-pill__dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--muted); transition: all .25s var(--ease);
}
.status-pill.running { border-color: var(--accent); color: var(--accent); }
.status-pill.running .status-pill__dot { background: var(--accent); animation: pulse 1s infinite; }
.status-pill.ok { border-color: var(--ok); color: var(--ok); }
.status-pill.ok .status-pill__dot { background: var(--ok); }
.status-pill.err { border-color: var(--err); color: var(--err); }
.status-pill.err .status-pill__dot { background: var(--err); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

/* =========================================================
   MAIN
   ========================================================= */
.main { flex: 1 1 auto; min-height: 0; display: flex; overflow: hidden; position: relative; }
.main::before {
  content: ""; position: absolute; inset: 0;
  background-image:
    linear-gradient(to right, rgba(17,17,17,.05) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(17,17,17,.05) 1px, transparent 1px);
  background-size: 56px 56px;
  mask-image: radial-gradient(ellipse at 50% 40%, #000 40%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse at 50% 40%, #000 40%, transparent 80%);
  pointer-events: none; z-index: 0;
}
.shell {
  position: relative; z-index: 1; width: 100%; max-width: 1700px; margin-inline: auto;
  padding: clamp(8px, 1.2vw, 20px) var(--gutter);
  display: grid; grid-template-columns: 1fr; gap: clamp(8px, 1vw, 14px);
  align-items: stretch; overflow: hidden; min-height: 0;
}
.shell.flow-hidden { max-width: 640px; }
.shell.flow-hidden #terminalSection { display: none; }

/* =========================================================
   PANEL (shared shell style — cream + black borders)
   ========================================================= */
.panel {
  width: 100%; height: 100%; border: var(--border-2); background: var(--bg);
  box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--ink);
  overflow: hidden; display: flex; flex-direction: column;
  min-height: 0; max-height: 100%;
}
.panel__head {
  flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 9px 14px;
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: .16em; text-transform: uppercase;
  border-bottom: var(--border);
  background: var(--bg);
}
.panel__head-meta { color: var(--accent); }
.panel__body {
  padding: clamp(12px, 1.4vw, 22px);
  display: flex; flex-direction: column; min-height: 0;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: var(--bg);
}
.panel__body::-webkit-scrollbar { width: 6px; }
.panel__body::-webkit-scrollbar-thumb { background: var(--ink); }

/* =========================================================
   FORM FIELDS
   ========================================================= */
.field { margin-bottom: clamp(8px, 0.8vw, 12px); }
.field__label { display: block; font-family: var(--font-mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
.field__row { display: flex; border: 2px solid var(--ink); background: var(--bg); transition: box-shadow .2s var(--ease); min-height: 44px; }
.field__row:focus-within { box-shadow: 3px 3px 0 var(--accent); }
.field__row.error { border-color: var(--accent); background: rgba(255,77,0,.05); }
.field__prefix { display: flex; align-items: center; padding: 0 10px; font-family: var(--font-mono); font-size: 13px; font-weight: 600; color: var(--muted); border-right: 2px solid var(--ink); background: var(--neutral); flex-shrink: 0; user-select: none; }
.field__input { flex: 1; min-width: 0; padding: 10px 12px; background: transparent; border: 0; outline: none; font-family: var(--font-mono); font-size: clamp(13px, 0.3vw + 12px, 15px); letter-spacing: .04em; color: var(--ink); border-radius: 0; appearance: none; -webkit-appearance: none; }
.field__input::placeholder { color: var(--muted); opacity: .55; }
.field__error { display: none; font-family: var(--font-mono); font-size: 10px; color: var(--accent); margin-top: 4px; line-height: 1.3; }
.field__error.show { display: block; }

/* =========================================================
   SEGMENTED CONTROL
   ========================================================= */
.seg { display: grid; border: 2px solid var(--ink); background: var(--bg); min-height: 44px; }
.seg--2 { grid-template-columns: 1fr 1fr; }
.seg__opt {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 12px;
  font-family: var(--font-mono); font-size: 11px; font-weight: 600;
  letter-spacing: .1em; text-transform: uppercase;
  cursor: pointer; user-select: none;
  background: var(--bg); color: var(--ink);
  transition: background .18s var(--ease), color .18s var(--ease);
  border-right: 2px solid var(--ink); text-align: center;
  -webkit-tap-highlight-color: transparent; position: relative; min-height: 40px;
}
.seg__opt:last-child { border-right: 0; }
.seg__opt input { position: absolute; opacity: 0; pointer-events: none; }
.seg__opt.checked { background: var(--ink); color: var(--bg); }
.seg__opt:hover:not(.checked) { background: var(--neutral); }

/* =========================================================
   BULK NUMBERS
   ========================================================= */
.numbers { display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; padding-right: 2px; }
.numbers::-webkit-scrollbar { width: 4px; }
.numbers::-webkit-scrollbar-thumb { background: var(--ink); }
.num-row { display: flex; gap: 4px; align-items: stretch; animation: rowIn .25s var(--ease-out); }
@keyframes rowIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
.num-row .field__row { flex: 1; min-width: 0; min-height: 42px; }
.num-row.invalid .field__row { border-color: var(--err); background: rgba(185,28,28,.04); }
.num-row__del {
  width: 42px; flex-shrink: 0; border: 2px solid var(--ink); background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 16px; font-weight: 600;
  transition: background .15s var(--ease), color .15s var(--ease);
  -webkit-tap-highlight-color: transparent;
}
.num-row__del:hover { background: var(--err); color: #fff; border-color: var(--err); }
.num-row__del:disabled { opacity: .35; cursor: not-allowed; }
.num-actions { display: flex; gap: 6px; margin-top: 8px; }
.num-actions .btn-mini {
  flex: 1; padding: 9px 12px; min-height: 40px;
  border: 2px solid var(--ink); background: var(--bg); color: var(--ink);
  font-family: var(--font-mono); font-size: 10px; font-weight: 600;
  letter-spacing: .1em; text-transform: uppercase;
  transition: background .15s var(--ease), color .15s var(--ease);
  text-align: center; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.num-actions .btn-mini:hover:not(:disabled) { background: var(--ink); color: var(--bg); }
.num-actions .btn-mini:disabled { opacity: .4; cursor: not-allowed; }
.num-count { font-family: var(--font-mono); font-size: 10px; color: var(--muted); margin-top: 6px; letter-spacing: .08em; }
.num-count strong { color: var(--accent); }

/* =========================================================
   COUNT STEPPER
   ========================================================= */
.count { display: flex; align-items: stretch; border: 2px solid var(--ink); min-height: 44px; }
.count__btn { width: 44px; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 18px; font-weight: 600; background: var(--neutral); border: 0; transition: background .15s var(--ease); -webkit-tap-highlight-color: transparent; }
.count__btn:hover:not(:disabled) { background: var(--ink); color: var(--bg); }
.count__btn:active:not(:disabled) { transform: scale(.95); }
.count__btn:disabled { opacity: .35; cursor: not-allowed; }
.count__val { flex: 1; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: clamp(14px, 0.4vw + 13px, 16px); font-weight: 600; letter-spacing: .04em; border-left: 2px solid var(--ink); border-right: 2px solid var(--ink); background: var(--bg); }

/* =========================================================
   GATEWAY PICKER
   ========================================================= */
.gw-picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px; margin-top: 4px; }
.gw-opt {
  display: flex; align-items: center; justify-content: center; gap: 4px;
  padding: 9px 10px; border: 2px solid var(--ink);
  font-family: var(--font-mono); font-size: 10px; font-weight: 600;
  letter-spacing: .06em; text-transform: uppercase;
  cursor: pointer; user-select: none;
  background: var(--bg); color: var(--ink);
  transition: background .18s var(--ease), color .18s var(--ease);
  text-align: center; min-height: 40px;
  -webkit-tap-highlight-color: transparent; position: relative;
}
.gw-opt input { position: absolute; opacity: 0; pointer-events: none; }
.gw-opt.checked { background: var(--accent); color: #fff; border-color: var(--accent); }
.gw-opt:hover:not(.checked) { background: var(--neutral); }

/* =========================================================
   CHECKBOX
   ========================================================= */
.check { display: flex; align-items: flex-start; gap: 10px; margin: clamp(10px, 1.2vw, 14px) 0; cursor: pointer; user-select: none; }
.check input { position: absolute; opacity: 0; pointer-events: none; }
.check__box { width: 20px; height: 20px; border: 2px solid var(--ink); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background .15s var(--ease); margin-top: 1px; }
.check__box svg { width: 14px; height: 14px; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; opacity: 0; transform: scale(.5); transition: opacity .15s, transform .15s var(--ease-out); }
.check input:checked + .check__box { background: var(--accent); border-color: var(--accent); }
.check input:checked + .check__box svg { opacity: 1; transform: scale(1); }
.check__text { font-size: clamp(11px, 0.3vw + 10px, 13px); line-height: 1.5; color: var(--ink-soft); }
.check__text a { color: var(--accent); border-bottom: 1px solid currentColor; }
.check__text a:hover { color: var(--ink); }
.check.error .check__box { border-color: var(--accent); background: rgba(255,77,0,.08); }
.check-error { font-family: var(--font-mono); font-size: 10px; color: var(--accent); margin: -8px 0 10px 30px; display: none; }
.check-error.show { display: block; }

/* =========================================================
   BUTTONS
   ========================================================= */
.btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: clamp(11px, 1vw, 14px) clamp(14px, 1.4vw, 20px); min-height: 48px;
  border: var(--border-2); font-family: var(--font-mono); font-size: clamp(11px, 0.5vw + 10px, 13px);
  font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
  background: var(--bg); color: var(--ink); border-radius: 0; overflow: hidden;
  transition: transform .2s var(--ease), box-shadow .2s var(--ease), color .2s var(--ease);
  text-align: center; width: 100%; cursor: pointer;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.btn > * { position: relative; z-index: 1; }
.btn::before { content: ""; position: absolute; inset: 0; background: var(--ink); transform: translateY(101%); transition: transform .3s var(--ease-out); z-index: 0; }
.btn:hover:not(:disabled) { transform: translate(-2px,-2px); box-shadow: 3px 3px 0 var(--ink); color: var(--bg); }
.btn:hover:not(:disabled)::before { transform: translateY(0); }
.btn:active:not(:disabled) { transform: translate(0,0); box-shadow: 1px 1px 0 var(--ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn--primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn--primary::before { background: var(--ink); }
.btn--primary:hover:not(:disabled) { color: #fff; }

/* =========================================================
   TERMINAL — same cream theme, monospace output
   ========================================================= */
#terminalSection {
  display: flex; flex-direction: column; min-height: 0; height: 100%;
  border: var(--border-2); background: var(--bg);
  overflow: hidden;
  box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--ink);
}

/* Title bar */
.term-bar {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px;
  background: var(--neutral);
  border-bottom: var(--border);
  font-family: var(--font-mono); font-size: 11px;
  color: var(--ink);
}
.term-bar__dots { display: flex; gap: 6px; flex-shrink: 0; }
.term-bar__dot { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--ink); }
.term-bar__dot--r { background: var(--accent); }
.term-bar__dot--y { background: var(--signal); }
.term-bar__dot--g { background: var(--bg); }
.term-bar__title {
  flex: 1; text-align: center; color: var(--ink);
  font-size: 11px; letter-spacing: .04em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.term-bar__title strong { color: var(--accent); font-weight: 600; }
.term-bar__meta {
  font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--muted); flex-shrink: 0;
  display: flex; align-items: center; gap: 6px;
}
.term-bar__meta::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%;
  background: var(--muted);
}
.term-bar__meta.idle { color: var(--muted); }
.term-bar__meta.idle::before { background: var(--muted); }
.term-bar__meta.running { color: var(--accent); }
.term-bar__meta.running::before { background: var(--accent); animation: pulse 1s infinite; }
.term-bar__meta.done { color: var(--ok); }
.term-bar__meta.done::before { background: var(--ok); }
.term-bar__meta.err { color: var(--err); }
.term-bar__meta.err::before { background: var(--err); }

/* Body */
.term-body {
  flex: 1 1 auto; min-height: 0;
  overflow-y: auto; overflow-x: hidden;
  padding: 14px 16px 22px;
  font-family: var(--font-mono);
  font-size: clamp(11px, 0.35vw + 10px, 13.5px);
  line-height: 1.55;
  color: var(--ink);
  background: var(--bg);
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}
.term-body::-webkit-scrollbar { width: 8px; }
.term-body::-webkit-scrollbar-track { background: var(--bg-soft); }
.term-body::-webkit-scrollbar-thumb { background: var(--ink); border-radius: 4px; }

/* Terminal line */
.tl {
  display: flex; gap: 8px;
  white-space: pre-wrap; word-break: break-word;
  animation: tlIn .18s var(--ease-out);
  margin: 0; padding: 0;
}
@keyframes tlIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }

.tl__t { color: var(--muted); flex-shrink: 0; user-select: none; font-size: .9em; }
.tl__m { flex: 1; min-width: 0; }

/* Sigils + colors — all in SMS Adda palette */
.tl--head .tl__m { color: var(--accent); font-weight: 700; letter-spacing: .04em; }
.tl--head .tl__m::before { content: "▸ "; color: var(--accent); }

.tl--fn .tl__m { color: var(--accent); }
.tl--fn .tl__m::before { content: "> "; color: var(--accent); font-weight: 700; }

.tl--ret .tl__m { color: var(--ink); font-weight: 500; }
.tl--ret .tl__m::before { content: "← "; color: var(--muted); font-weight: 700; }

.tl--ok .tl__m { color: var(--ok); font-weight: 500; }
.tl--ok .tl__m::before { content: "✓ "; font-weight: 700; }

.tl--err .tl__m { color: var(--err); font-weight: 500; }
.tl--err .tl__m::before { content: "✗ "; font-weight: 700; }

.tl--warn .tl__m { color: var(--warn); }
.tl--warn .tl__m::before { content: "! "; font-weight: 700; }

.tl--info .tl__m { color: var(--ink-soft); }
.tl--dim  .tl__m { color: var(--muted); }

/* Blinking cursor */
.term-cursor {
  display: inline-block;
  width: 7px; height: 1em;
  background: var(--accent);
  margin-left: 2px;
  vertical-align: -2px;
  animation: blink 1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* Bottom prompt */
.term-input {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 8px;
  padding: 8px 14px;
  border-top: var(--border);
  background: var(--bg-soft);
  font-family: var(--font-mono); font-size: 12px;
  color: var(--ink);
}
.term-input__prompt { color: var(--accent); font-weight: 700; }
.term-input__hint { color: var(--muted); font-size: 11px; letter-spacing: .02em; }

/* Banner + placeholder */
.term-banner {
  color: var(--accent);
  font-size: 10px;
  line-height: 1.15;
  margin-bottom: 10px;
  white-space: pre;
  overflow-x: auto;
  scrollbar-width: none;
  font-weight: 700;
}
.term-banner::-webkit-scrollbar { display: none; }

.term-placeholder {
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.8;
  padding: 4px 0;
}
.term-placeholder p { margin: 0; }
.term-placeholder .green { color: var(--ok); }
.term-placeholder .cyan  { color: var(--accent); }
.term-placeholder .yellow{ color: var(--warn); }
.term-placeholder .dim   { color: var(--muted); }

/* =========================================================
   RESPONSIVE
   ========================================================= */

/* Desktop ≥ 960: two real columns, form 400px max */
@media (min-width: 960px) {
  .shell:not(.flow-hidden) {
    grid-template-columns: minmax(380px, 420px) minmax(0, 1fr);
    align-items: stretch;
    gap: clamp(14px, 1.6vw, 22px);
  }
}

/* Tablet 640–959: stacked, terminal gets guaranteed space */
@media (max-width: 959px) {
  .shell:not(.flow-hidden) {
    grid-template-rows: auto minmax(340px, 1fr);
  }
  .shell:not(.flow-hidden) .panel { max-height: 52vh; }
  #terminalSection { min-height: 340px; }
}

/* Small mobile ≤ 520 */
@media (max-width: 520px) {
  .shell { padding: 8px var(--gutter); gap: 8px; }
  .shell:not(.flow-hidden) { grid-template-rows: auto minmax(320px, 1fr); }
  .shell:not(.flow-hidden) .panel { max-height: 50vh; }
  #terminalSection { min-height: 320px; }
  .panel__body { padding: 12px 12px 16px; }
  .gw-picker { grid-template-columns: repeat(2, 1fr); }
  .num-actions { flex-direction: column; }
  .count__btn { width: 40px; }
  .term-body { font-size: 11.5px; padding: 10px 12px 18px; }
  .term-bar__title { font-size: 10px; }
  .term-banner { font-size: 8.5px; }
}

/* Landscape phone: two columns as long as width allows, otherwise compact stack */
@media (max-height: 640px) and (orientation: landscape) {
  .nav { display: none; }
  .shell { padding: 6px var(--gutter); gap: 8px; }
  @media (min-width: 720px) {
    .shell:not(.flow-hidden) {
      grid-template-columns: minmax(280px, 340px) minmax(0, 1fr);
      grid-template-rows: 1fr;
    }
    .shell:not(.flow-hidden) .panel { max-height: 100%; }
    #terminalSection { min-height: 0; }
  }
  .panel__body { padding: 8px 12px; }
  .field { margin-bottom: 6px; }
  .field__row, .count, .seg { min-height: 36px; }
  .btn { min-height: 40px; padding: 8px 14px; }
  .term-body { font-size: 11px; padding: 8px 12px 14px; }
  .term-banner { font-size: 8px; margin-bottom: 6px; }
}

/* Tiny phones ≤ 360 */
@media (max-width: 360px) {
  .count__btn { width: 36px; font-size: 16px; }
  .count__val { font-size: 14px; }
  .num-row__del { width: 36px; }
  .seg__opt { font-size: 10px; padding: 6px 6px; }
  .term-body { font-size: 10.5px; }
  .nav__brand { font-size: 13px; }
  .status-pill { font-size: 9px; padding: 4px 8px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}
</style>
</head>
<body>

<header class="nav">
  <div class="nav__inner">
    <a class="nav__brand" href="index.html">SMS<span class="nav__brand-accent">ADDA</span></a>
    <span class="status-pill" id="statusPill" role="status" aria-live="polite">
      <span class="status-pill__dot"></span>
      <span id="statusText">IDLE</span>
    </span>
    <a class="nav__back" href="login.html">← Back</a>
  </div>
</header>

<main class="main">
  <div class="shell flow-hidden" id="shell">

    <!-- ==================== FORM ==================== -->
    <div class="panel" id="formSection">
      <div class="panel__head">
        <span>SMS ADDA / SEND</span>
        <span class="panel__head-meta" id="formMeta">READY</span>
      </div>
      <div class="panel__body">

        <form id="sendForm" novalidate autocomplete="on">

          <!-- Send mode -->
          <div class="field">
            <label class="field__label">Send mode</label>
            <div class="seg seg--2" role="radiogroup" aria-label="Send mode">
              <label class="seg__opt checked" data-mode="single">
                <input type="radio" name="sendMode" value="single" checked />
                <span>Single</span>
              </label>
              <label class="seg__opt" data-mode="bulk">
                <input type="radio" name="sendMode" value="bulk" />
                <span>Bulk</span>
              </label>
            </div>
          </div>

          <!-- Single -->
          <div id="singlePane">
            <div class="field">
              <label class="field__label" for="phone">Nepal phone number</label>
              <div class="field__row" id="phoneRow">
                <span class="field__prefix">+977</span>
                <input type="tel" id="phone" class="field__input" placeholder="98XXXXXXXX" inputmode="numeric" pattern="[0-9]*" autocomplete="tel-national" maxlength="10" />
              </div>
              <p class="field__error" id="phoneError">Enter a valid 10-digit number starting with 98 or 97</p>
            </div>
          </div>

          <!-- Bulk -->
          <div id="bulkPane" hidden>
            <div class="field">
              <label class="field__label">Phone numbers (bulk)</label>
              <div class="numbers" id="numbersList"></div>
              <div class="num-actions">
                <button type="button" class="btn-mini" id="addNumberBtn">+ Add number</button>
                <button type="button" class="btn-mini" id="clearNumbersBtn">Clear all</button>
              </div>
              <p class="num-count" id="numCount">0 numbers · <strong>0 valid</strong> · max 50</p>
              <p class="field__error" id="bulkError">Add at least one valid number</p>
            </div>
          </div>

          <!-- Count -->
          <div class="field">
            <label class="field__label" for="count" id="countLabel">Messages per number</label>
            <div class="count" id="countWrap">
              <button type="button" class="count__btn" id="countMinus" aria-label="Decrease">−</button>
              <div class="count__val" id="countVal" aria-live="polite">1</div>
              <button type="button" class="count__btn" id="countPlus" aria-label="Increase">+</button>
            </div>
          </div>

          <!-- Gateway mode -->
          <div class="field">
            <label class="field__label">Gateway selection</label>
            <div class="seg seg--2" role="radiogroup" aria-label="Gateway selection">
              <label class="seg__opt checked" data-gw="auto">
                <input type="radio" name="gwMode" value="auto" checked />
                <span>Auto</span>
              </label>
              <label class="seg__opt" data-gw="manual">
                <input type="radio" name="gwMode" value="manual" />
                <span>Manual</span>
              </label>
            </div>
          </div>

          <!-- Manual picker -->
          <div class="field" id="gwField" hidden>
            <label class="field__label">Pick gateways</label>
            <div class="gw-picker" id="gwPicker">
              <label class="gw-opt"><input type="checkbox" value="clamphook" /><span>Clamphook</span></label>
              <label class="gw-opt"><input type="checkbox" value="ambition" /><span>Ambition</span></label>
              <label class="gw-opt"><input type="checkbox" value="merodoctor" /><span>MeroDoctor</span></label>
              <label class="gw-opt"><input type="checkbox" value="collegeinfo" /><span>CollegeInfo</span></label>
              <label class="gw-opt"><input type="checkbox" value="pariksha" /><span>Pariksha</span></label>
              <label class="gw-opt"><input type="checkbox" value="quickconnect" /><span>QuickConnect</span></label>
            </div>
            <p class="field__error" id="gwError">Select at least one gateway</p>
          </div>

          <!-- Terms -->
          <label class="check" id="termsCheck" for="terms">
            <input type="checkbox" id="terms" />
            <span class="check__box" aria-hidden="true">
              <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
            </span>
            <span class="check__text">
              I agree to the <a href="terms.html" target="_blank" rel="noopener">Terms</a>
              and <a href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.
            </span>
          </label>
          <p class="check-error" id="termsError">You must agree to continue</p>

          <button type="submit" class="btn btn--primary" id="sendBtn">
            <span>Send OTP</span>
          </button>
        </form>

      </div>
    </div>

    <!-- ==================== TERMINAL ==================== -->
    <section id="terminalSection" hidden>
      <div class="term-bar">
        <div class="term-bar__dots">
          <span class="term-bar__dot term-bar__dot--r"></span>
          <span class="term-bar__dot term-bar__dot--y"></span>
          <span class="term-bar__dot term-bar__dot--g"></span>
        </div>
        <div class="term-bar__title">SMS Adda <strong>~/send</strong> — live backend trace</div>
        <div class="term-bar__meta idle" id="termMeta">idle</div>
      </div>
      <div class="term-body" id="termBody" role="log" aria-live="polite"></div>
      <div class="term-input">
        <span class="term-input__prompt">$</span>
        <span class="term-input__hint">run a send to see live output<span class="term-cursor"></span></span>
      </div>
    </section>

  </div>
</main>

<script>
(function () {
  "use strict";

  /* =========================================================
     CONFIG
     ========================================================= */
  var WORKER_URL = "https://smsbomber.ethical-laxman.workers.dev/";
  var GATEWAYS = [
    { id: "clamphook",   label: "Clamphook",   slug: "clamphook.com" },
    { id: "ambition",    label: "Ambition",    slug: "ambition.guru" },
    { id: "merodoctor",  label: "MeroDoctor",  slug: "merodoctor.com" },
    { id: "collegeinfo", label: "CollegeInfo", slug: "collegeinfonepal.com" },
    { id: "pariksha",    label: "Pariksha",    slug: "pariksha.solutions" },
    { id: "quickconnect",label: "QuickConnect",slug: "quickconnect.biz" }
  ];
  var SPEED = 1.0;
  var T = {
    line:     Math.round(240 / SPEED),
    fn:       Math.round(360 / SPEED),
    ret:      Math.round(420 / SPEED),
    step:     Math.round(520 / SPEED),
    pulse:    Math.round(600 / SPEED),
    perPhone: Math.round(220 / SPEED)
  };
  var MAX_BULK = 50;
  var MAX_COUNT_SINGLE = 10;
  var MAX_COUNT_BULK = 5;

  /* =========================================================
     DOM
     ========================================================= */
  var shell           = document.getElementById("shell");
  var terminalSection = document.getElementById("terminalSection");
  var form            = document.getElementById("sendForm");

  var singlePane      = document.getElementById("singlePane");
  var bulkPane        = document.getElementById("bulkPane");
  var phoneInput      = document.getElementById("phone");
  var phoneRow        = document.getElementById("phoneRow");
  var phoneError      = document.getElementById("phoneError");

  var numbersList     = document.getElementById("numbersList");
  var addNumberBtn    = document.getElementById("addNumberBtn");
  var clearNumbersBtn = document.getElementById("clearNumbersBtn");
  var numCount        = document.getElementById("numCount");
  var bulkError       = document.getElementById("bulkError");

  var countMinus      = document.getElementById("countMinus");
  var countPlus       = document.getElementById("countPlus");
  var countVal        = document.getElementById("countVal");
  var countLabel      = document.getElementById("countLabel");

  var gwField         = document.getElementById("gwField");
  var gwPicker        = document.getElementById("gwPicker");
  var gwError         = document.getElementById("gwError");

  var terms           = document.getElementById("terms");
  var termsCheck      = document.getElementById("termsCheck");
  var termsError      = document.getElementById("termsError");

  var sendBtn         = document.getElementById("sendBtn");
  var formMeta        = document.getElementById("formMeta");
  var termMeta        = document.getElementById("termMeta");
  var statusPill      = document.getElementById("statusPill");
  var statusText      = document.getElementById("statusText");
  var termBody        = document.getElementById("termBody");

  /* =========================================================
     STATE
     ========================================================= */
  var state = { sendMode: "single", gwMode: "auto", count: 1 };
  var bulkNumbers = [];
  var isSending = false;

  /* =========================================================
     UTILS
     ========================================================= */
  function isValidNepaliPhone(v) { return /^(98|97)\d{8}$/.test(v); }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function pad(n, w) { n = String(n); while (n.length < w) n = "0" + n; return n; }
  function nowStamp() {
    var d = new Date();
    return pad(d.getHours(), 2) + ":" + pad(d.getMinutes(), 2) + ":" + pad(d.getSeconds(), 2);
  }

  /* =========================================================
     TERMINAL WRITER
     ========================================================= */
  function termLine(text, kind) {
    var line = document.createElement("div");
    line.className = "tl" + (kind ? " tl--" + kind : "");
    var t = document.createElement("span");
    t.className = "tl__t";
    t.textContent = nowStamp();
    var m = document.createElement("span");
    m.className = "tl__m";
    m.textContent = text;
    line.appendChild(t);
    line.appendChild(m);
    termBody.appendChild(line);
    termBody.scrollTop = termBody.scrollHeight;
  }

  async function typeLine(text, kind, ms) {
    var line = document.createElement("div");
    line.className = "tl" + (kind ? " tl--" + kind : "");
    var t = document.createElement("span");
    t.className = "tl__t";
    t.textContent = nowStamp();
    var m = document.createElement("span");
    m.className = "tl__m";
    m.textContent = "";
    line.appendChild(t);
    line.appendChild(m);
    termBody.appendChild(line);

    var speed = ms || 14;
    for (var i = 0; i < text.length; i++) {
      m.textContent += text[i];
      if (i % 3 === 0) termBody.scrollTop = termBody.scrollHeight;
      await sleep(speed);
    }
    termBody.scrollTop = termBody.scrollHeight;
  }

  function clearTerm() { termBody.innerHTML = ""; }

  function showBanner() {
    var banner = document.createElement("pre");
    banner.className = "term-banner";
    banner.textContent =
      "  ███████╗███╗   ███╗███████╗     █████╗ ██████╗ ██████╗  █████╗ \n" +
      "  ██╔════╝████╗ ████║██╔════╝    ██╔══██╗██╔══██╗██╔══██╗██╔══██╗\n" +
      "  ███████╗██╔████╔██║███████╗    ███████║██║  ██║██║  ██║███████║\n" +
      "  ╚════██║██║╚██╔╝██║╚════██║    ██╔══██║██║  ██║██║  ██║██╔══██║\n" +
      "  ███████║██║ ╚═╝ ██║███████║    ██║  ██║██████╔╝██████╔╝██║  ██║\n" +
      "  ╚══════╝╚═╝     ╚═╝╚══════╝    ╚═╝  ╚═╝╚═════╝ ╚═════╝ ╚═╝  ╚═╝";
    termBody.appendChild(banner);

    var info = document.createElement("div");
    info.className = "term-placeholder";
    info.innerHTML =
      '<p class="dim">backend trace v1.0 · live debugging enabled</p>' +
      '<p class="dim">worker: <span class="cyan">' + WORKER_URL + '</span></p>' +
      '<p class="dim">────────────────────────────────────────────</p>' +
      '<p>ready. <span class="green">watching for a send event</span><span class="term-cursor"></span></p>';
    termBody.appendChild(info);
  }

  function setTermMeta(kind, text) {
    termMeta.className = "term-bar__meta" + (kind ? " " + kind : " idle");
    termMeta.textContent = text;
  }

  /* =========================================================
     FORM: MODES
     ========================================================= */
  function setSendMode(val) {
    if (val === state.sendMode) return;
    state.sendMode = val;
    document.querySelectorAll('[data-mode]').forEach(function (l) {
      var isThis = l.getAttribute("data-mode") === val;
      l.classList.toggle("checked", isThis);
      var inp = l.querySelector("input");
      if (inp) inp.checked = isThis;
    });
    singlePane.hidden = (val !== "single");
    bulkPane.hidden   = (val !== "bulk");
    if (val === "bulk") syncBulkFromDOM();
    var cap = (val === "bulk") ? MAX_COUNT_BULK : MAX_COUNT_SINGLE;
    if (state.count > cap) state.count = cap;
    updateCount();
    updateNumCount();
  }
  document.querySelectorAll('[data-mode]').forEach(function (label) {
    label.addEventListener("click", function () {
      setSendMode(label.getAttribute("data-mode"));
    });
  });

  document.querySelectorAll('[data-gw]').forEach(function (label) {
    label.addEventListener("click", function () {
      var val = label.getAttribute("data-gw");
      state.gwMode = val;
      document.querySelectorAll('[data-gw]').forEach(function (l) {
        var isThis = l.getAttribute("data-gw") === val;
        l.classList.toggle("checked", isThis);
        var inp = l.querySelector("input");
        if (inp) inp.checked = isThis;
      });
      gwField.hidden = (val !== "manual");
      gwError.classList.remove("show");
    });
  });

  gwPicker.querySelectorAll('input[type="checkbox"]').forEach(function (cb) {
    cb.addEventListener("change", function () {
      cb.closest(".gw-opt").classList.toggle("checked", cb.checked);
      var any = gwPicker.querySelectorAll('input:checked').length > 0;
      gwError.classList.toggle("show", !any);
    });
  });

  /* =========================================================
     BULK NUMBERS
     ========================================================= */
  function createNumberRow(value) {
    var row = document.createElement("div");
    row.className = "num-row";
    row.innerHTML =
      '<div class="field__row">' +
        '<span class="field__prefix">+977</span>' +
        '<input type="tel" class="field__input" placeholder="98XXXXXXXX" inputmode="numeric" pattern="[0-9]*" maxlength="10" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />' +
      '</div>' +
      '<button type="button" class="num-row__del" aria-label="Remove">×</button>';
    var input = row.querySelector("input");
    var del = row.querySelector(".num-row__del");

    input.value = value || "";
    input.addEventListener("input", function () {
      this.value = this.value.replace(/\D/g, "").slice(0, 10);
      row.classList.toggle("invalid",
        this.value.length === 10 && !isValidNepaliPhone(this.value));
      syncBulkFromDOM();
    });
    input.addEventListener("keydown", function (e) {
      if (["e","E","+","-",".",","].indexOf(e.key) !== -1) e.preventDefault();
    });
    del.addEventListener("click", function () {
      row.remove();
      syncBulkFromDOM();
    });
    numbersList.appendChild(row);
    return row;
  }

  function syncBulkFromDOM() {
    bulkNumbers = Array.prototype.slice.call(
      numbersList.querySelectorAll('input[type="tel"]')
    ).map(function (i) { return i.value.replace(/\D/g, ""); }).filter(Boolean);
    updateNumCount();
  }

  function updateNumCount() {
    var total = numbersList.querySelectorAll(".num-row").length;
    var valid = bulkNumbers.filter(isValidNepaliPhone).length;
    numCount.innerHTML = total + " number" + (total !== 1 ? "s" : "") +
      " · <strong>" + valid + " valid</strong> · max " + MAX_BULK;
    clearNumbersBtn.disabled = total === 0 || isSending;
    addNumberBtn.disabled = total >= MAX_BULK || isSending;
    if (state.sendMode === "bulk" && total > 0 && valid === 0) {
      bulkError.classList.add("show");
    } else {
      bulkError.classList.remove("show");
    }
  }

  addNumberBtn.addEventListener("click", function () {
    if (numbersList.querySelectorAll(".num-row").length >= MAX_BULK) return;
    var row = createNumberRow("");
    row.querySelector("input").focus();
    syncBulkFromDOM();
  });
  clearNumbersBtn.addEventListener("click", function () {
    numbersList.innerHTML = "";
    bulkNumbers = [];
    updateNumCount();
  });

  /* =========================================================
     COUNT
     ========================================================= */
  function maxCount() { return state.sendMode === "bulk" ? MAX_COUNT_BULK : MAX_COUNT_SINGLE; }
  function updateCount() {
    countVal.textContent = state.count;
    countMinus.disabled = state.count <= 1 || isSending;
    countPlus.disabled  = state.count >= maxCount() || isSending;
    countLabel.textContent = "Messages per number (max " + maxCount() + ")";
  }
  countMinus.addEventListener("click", function () {
    if (state.count > 1) { state.count--; updateCount(); }
  });
  countPlus.addEventListener("click", function () {
    if (state.count < maxCount()) { state.count++; updateCount(); }
  });

  /* =========================================================
     PHONE VALIDATION
     ========================================================= */
  function validatePhone() {
    var ok = isValidNepaliPhone(phoneInput.value.replace(/\D/g, ""));
    phoneRow.classList.toggle("error", !ok);
    phoneError.classList.toggle("show", !ok);
    return ok;
  }
  phoneInput.addEventListener("input", function () {
    this.value = this.value.replace(/\D/g, "").slice(0, 10);
    if (this.value.length === 10) validatePhone();
    else { phoneRow.classList.remove("error"); phoneError.classList.remove("show"); }
  });
  phoneInput.addEventListener("keydown", function (e) {
    if (["e","E","+","-",".",","].indexOf(e.key) !== -1) e.preventDefault();
  });

  /* =========================================================
     TERMS
     ========================================================= */
  terms.addEventListener("change", function () {
    if (terms.checked) {
      termsCheck.classList.remove("error");
      termsError.classList.remove("show");
    }
  });

  /* =========================================================
     STATUS
     ========================================================= */
  function setStatus(mode, text) {
    statusPill.classList.remove("running", "ok", "err");
    if (mode) statusPill.classList.add(mode);
    statusText.textContent = text;
  }

  /* =========================================================
     DISABLE / ENABLE
     ========================================================= */
  function setControlsDisabled(disabled) {
    countMinus.disabled = disabled || state.count <= 1;
    countPlus.disabled = disabled || state.count >= maxCount();
    document.querySelectorAll('[data-mode], [data-gw]').forEach(function (l) {
      l.style.pointerEvents = disabled ? "none" : "";
      l.style.opacity = disabled ? "0.55" : "";
    });
    gwPicker.querySelectorAll('input').forEach(function (cb) { cb.disabled = disabled; });
    numbersList.querySelectorAll("input, button").forEach(function (el) { el.disabled = disabled; });
    addNumberBtn.disabled = disabled || numbersList.querySelectorAll(".num-row").length >= MAX_BULK;
    clearNumbersBtn.disabled = disabled || numbersList.querySelectorAll(".num-row").length === 0;
    phoneInput.disabled = disabled;
  }

  /* =========================================================
     THE TERMINAL FLOW
     ========================================================= */
  async function runFlow(phones, perNumber, gwMode, manualIds) {
    isSending = true;
    setControlsDisabled(true);
    sendBtn.disabled = true;
    sendBtn.querySelector("span").textContent = "Running…";
    formMeta.textContent = "RUNNING";
    setTermMeta("running", "running");
    setStatus("running", "RUNNING");

    clearTerm();
    showBanner();
    await sleep(400);

    /* 01 CLIENT */
    await typeLine("[01/06] client.submit()", "head", 12);
    await sleep(T.line);
    termLine("  source = \"browser\"", "info");
    termLine("  target = \"" + WORKER_URL + "\"", "info");
    termLine("  phone_count = " + phones.length, "info");
    termLine("  messages_per_phone = " + perNumber, "info");
    termLine("  gateway_mode = \"" + gwMode + "\"", "info");
    if (gwMode === "manual") termLine("  manual_gateways = [" + manualIds.join(", ") + "]", "info");
    await sleep(T.step);

    await typeLine("fetch(WORKER_URL, { method: 'POST', body })", "fn");
    await sleep(T.fn);
    termLine("  → awaiting response…", "dim");
    await sleep(T.pulse);

    /* 02 WORKER */
    await typeLine("[02/06] worker.fetch(request, env)", "head", 12);
    await sleep(T.line);
    termLine("  request.method = \"POST\"", "info");
    termLine("  request.headers['content-type'] = \"application/json\"", "info");
    await sleep(T.step);

    await typeLine("body = await request.json()", "fn");
    await sleep(T.fn);
    termLine("body = { phone: ..., count: " + perNumber + ", gateway: \"" + gwMode + "\" }", "ret");
    await sleep(T.ret);

    /* 03 VALIDATE */
    await typeLine("[03/06] validatePhone(phone)", "head", 12);
    await sleep(T.line);
    for (var p = 0; p < phones.length; p++) {
      await typeLine("  validatePhone('" + phones[p] + "')", "fn", 10);
      await sleep(T.fn);
      termLine("  → ok  · +977" + phones[p], "ok");
      await sleep(T.perPhone);
    }
    termLine("  " + phones.length + " phone(s) validated", "ok");
    await sleep(T.step);

    /* 04 SELECT */
    await typeLine("[04/06] selectGateways(mode)", "head", 12);
    await sleep(T.line);

    var order;
    if (gwMode === "manual" && manualIds.length) {
      order = manualIds.map(function (id) {
        var idx = GATEWAYS.findIndex(function (g) { return g.id === id; });
        return idx >= 0 ? GATEWAYS[idx] : null;
      }).filter(Boolean);
      termLine("  mode = \"manual\"", "info");
      termLine("  candidates = [" + order.map(function (g) { return '"' + g.id + '"'; }).join(", ") + "]", "info");
    } else {
      order = GATEWAYS.slice().sort(function () { return Math.random() - 0.5; });
      termLine("  mode = \"auto\"", "info");
      termLine("  candidates = shuffled([" + order.map(function (g) { return '"' + g.id + '"'; }).join(", ") + "])", "info");
    }
    await sleep(T.step);

    if (order.length === 0) {
      termLine("  ✗ no gateways available", "err");
      await finishFlow(false, phones, perNumber);
      return;
    }

    /* 05 GATEWAY LOOP */
    await typeLine("[05/06] tryGateways(phone, candidates)", "head", 12);
    await sleep(T.line);

    var winner = null;
    for (var i = 0; i < order.length; i++) {
      var gw = order[i];
      termLine("", "dim");
      await typeLine("callGateway('" + gw.slug + "', phone)  // attempt " + (i + 1), "fn", 12);
      await sleep(T.fn);
      termLine("  → opening connection to " + gw.slug, "info");
      await sleep(T.pulse * 0.4);
      var success = (gwMode === "manual") ? true : (i >= 1);
      if (success) {
        termLine("  → response.status = 200", "info");
        termLine("  → body.success = true", "info");
        termLine("  → SMS dispatched to +977" + phones[0], "ret");
        termLine("gateway '" + gw.label + "' accepted the request", "ok");
        winner = gw;
        break;
      } else {
        termLine("  → response.status = 500", "info");
        termLine("  → body.success = false", "info");
        termLine("gateway '" + gw.label + "' rejected · rotating", "warn");
        await sleep(T.step);
      }
    }

    if (!winner) {
      termLine("", "dim");
      termLine("all candidates exhausted · no dispatch", "err");
      await finishFlow(false, phones, perNumber);
      return;
    }

    /* 06 DELIVERY */
    await typeLine("[06/06] delivery", "head", 12);
    await sleep(T.line);
    termLine("  winner = \"" + winner.label + "\"", "ret");
    termLine("  total_sms = " + (phones.length * perNumber), "info");
    await sleep(T.step);

    var sentCount = 0;
    var totalCount = phones.length * perNumber;
    for (var n = 0; n < phones.length; n++) {
      for (var k = 0; k < perNumber; k++) {
        await typeLine("  sendSMS('+977" + phones[n] + "')  [" + (sentCount + 1) + "/" + totalCount + "]", "fn", 8);
        await sleep(T.perPhone);
        termLine("  ✓ delivered to +977" + phones[n], "ok");
        sentCount++;
      }
    }

    await sleep(T.step);
    termLine("", "dim");
    termLine("────────────────────────────────────────────", "dim");
    termLine("flow complete · " + sentCount + " message(s) sent via " + winner.label, "ok");
    termLine("timestamp = " + new Date().toISOString(), "info");

    await finishFlow(true, phones, perNumber);
  }

  async function finishFlow(ok, phones, perNumber) {
    isSending = false;
    setControlsDisabled(false);
    sendBtn.disabled = false;
    sendBtn.querySelector("span").textContent = "Send OTP";
    updateCount();
    updateNumCount();
    if (ok) {
      setStatus("ok", "DELIVERED");
      setTermMeta("done", "complete");
      formMeta.textContent = "SENT";
    } else {
      setStatus("err", "FAILED");
      setTermMeta("err", "failed");
      formMeta.textContent = "FAILED";
    }
  }

  /* =========================================================
     SUBMIT
     ========================================================= */
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (isSending) return;

    var phones = [];
    if (state.sendMode === "single") {
      if (!validatePhone()) { phoneInput.focus(); return; }
      phones = [phoneInput.value.replace(/\D/g, "")];
    } else {
      syncBulkFromDOM();
      phones = bulkNumbers.filter(isValidNepaliPhone);
      if (phones.length === 0) { bulkError.classList.add("show"); return; }
      bulkError.classList.remove("show");
    }

    var manualIds = [];
    if (state.gwMode === "manual") {
      manualIds = Array.prototype.slice.call(
        gwPicker.querySelectorAll('input[type="checkbox"]:checked')
      ).map(function (cb) { return cb.value; });
      if (manualIds.length === 0) { gwError.classList.add("show"); return; }
    }

    if (!terms.checked) {
      termsCheck.classList.add("error");
      termsError.classList.add("show");
      return;
    }
    termsCheck.classList.remove("error");
    termsError.classList.remove("show");

    terminalSection.hidden = false;
    shell.classList.remove("flow-hidden");

    runFlow(phones, state.count, state.gwMode, manualIds);
  });

  /* =========================================================
     INIT
     ========================================================= */
  createNumberRow("");
  syncBulkFromDOM();

  singlePane.hidden = false;
  bulkPane.hidden = true;
  gwField.hidden = true;

  updateCount();
  updateNumCount();
  setStatus(null, "IDLE");

})();
</script>
</body>
</html>
