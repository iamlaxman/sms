<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Send — SMS Adda</title>
<meta name="description" content="Send OTP messages through SMS Adda." />
<meta name="theme-color" content="#F4F1E8" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="SMS Adda" />

<link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />

<link rel="shortcut icon" href="/favicon/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
<link rel="manifest" href="/favicon/site.webmanifest" />

<script>
(function () {
  try {
    var raw = localStorage.getItem("smsadda_user");
    if (!raw) { window.location.replace("/login.html"); return; }
    var u = JSON.parse(raw);
    if (!u || !u.phone) {
      localStorage.removeItem("smsadda_user");
      window.location.replace("/login.html");
      return;
    }
    var signed = u.signedInAt ? new Date(u.signedInAt).getTime() : 0;
    var THIRTY = 30 * 24 * 60 * 60 * 1000;
    if (!signed || Date.now() - signed > THIRTY) {
      localStorage.removeItem("smsadda_user");
      window.location.replace("/login.html");
      return;
    }
    window.__smsUser = u;
  } catch (e) {
    try { localStorage.removeItem("smsadda_user"); } catch (_) {}
    window.location.replace("/login.html");
  }
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
/* =========================================================
   TOKENS
   ========================================================= */
:root {
  --bg:       #F4F1E8;
  --ink:      #0a0a0a;
  --ink-2:    #0d0d0d;
  --accent:   #FF4D00;
  --accent-2: #FF8A3D;
  --neutral:  #E5E0D5;
  --signal:   #DFFF00;
  --muted:    #6b665c;
  --ok:       #4ade80;
  --warn:     #fbbf24;
  --err:      #f87171;

  --font-display: "Space Grotesk", system-ui, -apple-system, sans-serif;
  --font-mono:    "IBM Plex Mono", ui-monospace, Menlo, monospace;

  --ease:     cubic-bezier(.2,.7,.2,1);
  --ease-out: cubic-bezier(.16,1,.3,1);
  --max:      1760px;
  --nav-h:    66px;
  --radius-lg: 22px;
}

/* =========================================================
   RESET
   ========================================================= */
[hidden] { display: none !important; }

*, *::before, *::after {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent !important;
  -webkit-touch-callout: none;
}
html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  scroll-behavior: smooth;
}
body {
  margin: 0;
  font-family: var(--font-display);
  background: var(--bg);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100vh;
  min-height: 100svh;
  min-height: 100dvh;
  overflow-x: hidden;
}
body.modal-open { overflow: hidden; }

img, svg { display: block; max-width: 100%; }
button {
  font: inherit; color: inherit; background: none; border: 0;
  cursor: pointer; padding: 0;
  -webkit-user-select: none; user-select: none;
}
a { color: inherit; text-decoration: none; -webkit-user-select: none; user-select: none; }
input { font: inherit; color: inherit; }
::selection { background: var(--accent); color: #fff; }

/* =========================================================
   FOCUS / OUTLINE — kill all rings and highlights
   ========================================================= */
a:focus, button:focus, input:focus { outline: none; }
input:focus,
input:focus-visible,
input:active {
  outline: none;
  box-shadow: none;
  -webkit-tap-highlight-color: transparent;
}
a:focus-visible, button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

/* =========================================================
   NAV
   ========================================================= */
.nav {
  position: sticky;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  background: rgba(244,241,232,.92);
  backdrop-filter: saturate(150%) blur(16px);
  -webkit-backdrop-filter: saturate(150%) blur(16px);
  border-bottom: 1px solid rgba(17,17,17,.08);
  padding-top: env(safe-area-inset-top, 0px);
  flex-shrink: 0;
}
.nav__inner {
  max-width: var(--max);
  margin-inline: auto;
  padding: 0 clamp(14px, 2.5vw, 36px);
  height: var(--nav-h);
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 16px;
  letter-spacing: -0.01em;
  color: var(--ink);
  flex-shrink: 0;
  transition: transform .25s var(--ease);
}
.logo:hover { transform: translateY(-1px); }
.logo__mark {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: var(--ink);
  color: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: transform .25s var(--ease);
}
.logo:hover .logo__mark { transform: rotate(-6deg); }
.logo__mark svg { width: 18px; height: 18px; fill: currentColor; }
.logo__text { white-space: nowrap; }
.logo__text em { font-style: normal; color: var(--accent); }

.nav__divider {
  width: 1px;
  height: 22px;
  background: rgba(17,17,17,.12);
  flex-shrink: 0;
}
.nav__page {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--muted);
  flex-shrink: 0;
}

.nav__spacer { flex: 1; min-width: 0; }

.status-pill {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: .14em;
  text-transform: uppercase;
  padding: 7px 13px;
  border-radius: 999px;
  border: 1px solid rgba(17,17,17,.12);
  color: var(--muted);
  display: inline-flex;
  align-items: center;
  gap: 7px;
  transition: all .25s var(--ease);
  flex-shrink: 0;
  background: rgba(255,255,255,.55);
  white-space: nowrap;
}
.status-pill::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
  flex-shrink: 0;
  transition: all .25s var(--ease);
}
.status-pill.running { border-color: rgba(255,77,0,.45); color: var(--accent); background: rgba(255,77,0,.07); }
.status-pill.running::before { background: var(--accent); animation: pulse 1s infinite; }
.status-pill.ok { border-color: rgba(26,127,55,.45); color: #1a7f37; background: rgba(26,127,55,.07); }
.status-pill.ok::before { background: #1a7f37; }
.status-pill.err { border-color: rgba(185,28,28,.45); color: #b91c1c; background: rgba(185,28,28,.07); }
.status-pill.err::before { background: #b91c1c; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

.nav__logout {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 14px;
  border-radius: 999px;
  border: 1px solid rgba(17,17,17,.12);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink);
  background: rgba(255,255,255,.55);
  transition: background .2s var(--ease), color .2s var(--ease), border-color .2s var(--ease), transform .15s var(--ease);
  flex-shrink: 0;
  min-height: 38px;
  white-space: nowrap;
}
.nav__logout:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.nav__logout:active { transform: scale(.97); }
.nav__logout svg {
  width: 14px;
  height: 14px;
  stroke: currentColor;
  stroke-width: 2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}

@media (max-width: 860px) {
  .nav__divider, .nav__page { display: none; }
}
@media (max-width: 640px) {
  :root { --nav-h: 58px; --radius-lg: 20px; }
  .nav__inner { gap: 8px; padding-inline: 14px; }
  .logo { font-size: 15px; gap: 8px; }
  .logo__mark { width: 30px; height: 30px; border-radius: 9px; }
  .logo__mark svg { width: 16px; height: 16px; }
  .status-pill { font-size: 9px; padding: 5px 10px; letter-spacing: .12em; }
  .nav__logout { padding: 7px 11px; font-size: 9px; min-height: 34px; }
  .nav__logout .label { display: none; }
}

/* =========================================================
   WORKSPACE
   ========================================================= */
.workspace {
  background: var(--ink);
  color: var(--bg);
  position: relative;
  overflow: hidden;
}
.workspace::before {
  content: "";
  position: absolute; inset: 0;
  background:
    radial-gradient(circle at 30% 0%, rgba(255,77,0,.12), transparent 55%),
    radial-gradient(circle at 70% 100%, rgba(223,255,0,.04), transparent 50%);
  pointer-events: none;
  z-index: 0;
}
.workspace::after {
  content: "";
  position: absolute; inset: 0;
  background-image:
    linear-gradient(to right, rgba(244,241,232,.025) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(244,241,232,.025) 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: radial-gradient(ellipse at 50% 40%, #000 20%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse at 50% 40%, #000 20%, transparent 75%);
  pointer-events: none;
  z-index: 0;
}

.workspace__inner {
  position: relative;
  z-index: 1;
  max-width: var(--max);
  margin-inline: auto;
  padding: clamp(16px, 2vw, 28px) clamp(16px, 2.5vw, 36px);
  display: grid;
  grid-template-columns: 1fr;
  gap: clamp(16px, 2vw, 28px);
  align-items: start;
}

/* Desktop: fit viewport, no page scroll */
@media (min-width: 1024px) {
  html, body {
    height: 100%;
    overflow: hidden;
  }
  body { display: flex; flex-direction: column; }
  .workspace {
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
  }
  .workspace__inner {
    height: 100%;
    min-height: 0;
    align-items: stretch;
    grid-template-columns: minmax(380px, 440px) minmax(0, 1fr);
    gap: clamp(18px, 2vw, 32px);
    padding-top: clamp(16px, 2vw, 28px);
    padding-bottom: clamp(16px, 2vw, 28px);
  }
  .form-col {
    max-width: none;
    margin: 0;
    min-height: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  .terminal-col {
    min-height: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
}

/* Tablet/Mobile: natural page scroll, terminal always visible */
@media (max-width: 1023px) {
  .workspace__inner {
    padding: 16px 16px 32px;
    gap: 16px;
  }
  .form-col { max-width: 640px; margin-inline: auto; width: 100%; }
  .terminal-col { width: 100%; }
}
@media (max-width: 640px) {
  .workspace__inner { padding: 14px 14px 28px; gap: 14px; }
}

/* =========================================================
   FORM
   ========================================================= */
.form-col { width: 100%; max-width: 560px; margin-inline: auto; }

.form {
  position: relative;
  display: flex;
  flex-direction: column;
  min-height: 0;
  border-radius: var(--radius-lg);
  border: 1px solid rgba(255,255,255,.06);
  background: linear-gradient(180deg, rgba(255,255,255,.03) 0%, rgba(255,255,255,.01) 100%);
  overflow: hidden;
}
.form::before {
  content: "";
  position: absolute; inset: 0;
  border-radius: inherit;
  padding: 1px;
  background: linear-gradient(135deg, rgba(255,77,0,.15), transparent 40%, transparent 60%, rgba(223,255,0,.06));
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
          mask-composite: exclude;
  pointer-events: none;
  z-index: 1;
}

.form__scroll {
  display: flex;
  flex-direction: column;
  gap: clamp(12px, 1.4vw, 16px);
  padding: clamp(16px, 2vw, 24px);
  min-height: 0;
  position: relative;
  z-index: 0;
}
@media (min-width: 1024px) {
  .form { flex: 1 1 auto; }
  .form__scroll {
    flex: 1 1 auto;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .form__scroll::-webkit-scrollbar { display: none; }
}

/* =========================================================
   FIELDS
   ========================================================= */
.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.field__label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: rgba(244,241,232,.5);
  padding-left: 6px;
}

/* =========================================================
   PHONE FIELD — no ring, no box on focus
   ========================================================= */
.field__wrap {
  display: flex;
  align-items: center;
  background: rgba(255,255,255,.045);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 999px;
  min-height: 52px;
  padding: 0 18px;
  transition: border-color .2s var(--ease), background .2s var(--ease);
}
/* Focus: only a subtle border tint — no shadow ring, no box */
.field__wrap:focus-within {
  border-color: rgba(255,77,0,.45);
  background: rgba(255,255,255,.055);
  box-shadow: none;
  outline: none;
}
.field__wrap.error {
  border-color: rgba(255,77,0,.7);
  background: rgba(255,77,0,.06);
}

.field__icon {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  margin-right: 10px;
  color: rgba(244,241,232,.4);
  transition: color .2s var(--ease);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.field__wrap:focus-within .field__icon { color: var(--accent); }
.field__icon svg {
  width: 100%; height: 100%;
  stroke: currentColor;
  stroke-width: 1.8;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.field__prefix {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 600;
  color: rgba(244,241,232,.75);
  margin-right: 8px;
  flex-shrink: 0;
  letter-spacing: 0;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  user-select: none;
}

.field__input {
  flex: 1 1 auto;
  min-width: 0;
  background: transparent;
  border: 0;
  outline: none;
  color: var(--bg);
  font-family: var(--font-mono);
  font-size: 15px;
  letter-spacing: 0;
  line-height: 1.4;
  padding: 14px 0;
  border-radius: 0;
  appearance: none;
  -webkit-appearance: none;
  font-variant-numeric: tabular-nums;
  /* Kill every possible focus ring / box */
  box-shadow: none;
  -webkit-tap-highlight-color: transparent;
}
.field__input:focus,
.field__input:focus-visible,
.field__input:active {
  outline: none !important;
  box-shadow: none !important;
  border: 0 !important;
}
.field__input::placeholder {
  color: rgba(244,241,232,.28);
  letter-spacing: 0;
  font-variant-numeric: tabular-nums;
}
.field__input:-webkit-autofill,
.field__input:-webkit-autofill:hover,
.field__input:-webkit-autofill:focus {
  -webkit-text-fill-color: var(--bg);
  -webkit-box-shadow: 0 0 0 1000px var(--ink) inset;
  transition: background-color 9999s ease-out;
}

.field__error {
  display: none;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: .04em;
  color: var(--accent-2);
  padding-left: 20px;
  line-height: 1.5;
}
.field__error.show { display: block; }

/* iOS: 16px min font to prevent auto-zoom on focus */
@supports (-webkit-touch-callout: none) {
  .field__input { font-size: 16px; }
}

/* =========================================================
   SEGMENTED CONTROL
   ========================================================= */
.seg {
  display: grid;
  grid-template-columns: 1fr 1fr;
  border: 1px solid rgba(255,255,255,.08);
  background: rgba(255,255,255,.045);
  border-radius: 999px;
  min-height: 50px;
  padding: 4px;
  gap: 4px;
}
.seg__opt {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 14px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  cursor: pointer;
  user-select: none;
  background: transparent;
  color: rgba(244,241,232,.5);
  border-radius: 999px;
  transition: background .22s var(--ease), color .22s var(--ease), box-shadow .22s var(--ease);
  text-align: center;
  position: relative;
  min-height: 42px;
}
.seg__opt input { position: absolute; opacity: 0; pointer-events: none; }
.seg__opt.checked {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
  color: #fff;
  box-shadow: 0 4px 12px rgba(255,77,0,.25);
}
.seg__opt:hover:not(.checked) { color: var(--bg); background: rgba(255,255,255,.04); }

/* =========================================================
   COUNT STEPPER
   ========================================================= */
.count {
  display: flex;
  align-items: center;
  border: 1px solid rgba(255,255,255,.08);
  background: rgba(255,255,255,.045);
  border-radius: 999px;
  min-height: 52px;
  padding: 4px;
  gap: 4px;
}
.count__btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(255,255,255,.06);
  color: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 20px;
  font-weight: 500;
  flex-shrink: 0;
  transition: background .18s var(--ease), color .18s var(--ease), transform .1s var(--ease);
}
.count__btn:hover:not(:disabled) { background: var(--accent); color: #fff; }
.count__btn:active:not(:disabled) { transform: scale(.94); }
.count__btn:disabled { opacity: .3; cursor: not-allowed; }
.count__val {
  flex: 1;
  text-align: center;
  font-family: var(--font-mono);
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 0;
  color: var(--bg);
  font-variant-numeric: tabular-nums;
}

/* =========================================================
   BULK
   ========================================================= */
.bulk-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 200px;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding-right: 4px;
}
.bulk-list::-webkit-scrollbar { width: 3px; }
.bulk-list::-webkit-scrollbar-thumb { background: rgba(244,241,232,.2); }
.bulk-row {
  display: flex;
  gap: 6px;
  align-items: stretch;
  animation: rowIn .25s var(--ease-out);
}
@keyframes rowIn {
  from { opacity: 0; transform: translateY(-4px); }
  to   { opacity: 1; transform: translateY(0); }
}
.bulk-row .field__wrap { flex: 1; min-width: 0; min-height: 48px; padding: 0 14px; }
.bulk-row .field__prefix { font-size: 13px; margin-right: 6px; }
.bulk-row .field__input { padding: 12px 0; }
.bulk-row.invalid .field__wrap {
  border-color: rgba(248,113,113,.6);
  background: rgba(248,113,113,.06);
}
.bulk-row__del {
  width: 48px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.08);
  background: rgba(255,255,255,.045);
  color: rgba(244,241,232,.65);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 500;
  flex-shrink: 0;
  transition: background .18s var(--ease), color .18s var(--ease), border-color .18s var(--ease);
}
.bulk-row__del:hover:not(:disabled) { background: var(--err); color: var(--ink); border-color: var(--err); }
.bulk-row__del:disabled { opacity: .35; cursor: not-allowed; }

.bulk-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  margin-top: 8px;
}
.bulk-actions .btn-mini--full { grid-column: 1 / -1; }

.btn-mini {
  padding: 9px 12px;
  min-height: 42px;
  border: 1px solid rgba(255,255,255,.1);
  background: rgba(255,255,255,.045);
  color: var(--bg);
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  border-radius: 999px;
  transition: background .18s var(--ease), color .18s var(--ease), border-color .18s var(--ease);
  text-align: center;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  white-space: nowrap;
}
.btn-mini:hover:not(:disabled) { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.2); }
.btn-mini:disabled { opacity: .35; cursor: not-allowed; }
.btn-mini svg {
  width: 13px;
  height: 13px;
  stroke: currentColor;
  stroke-width: 2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}

.file-input-hidden {
  position: absolute;
  width: 1px; height: 1px;
  opacity: 0; pointer-events: none;
  overflow: hidden;
}

.bulk-count {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: .08em;
  color: rgba(244,241,232,.45);
  padding-left: 6px;
  margin-top: 8px;
}
.bulk-count strong { color: var(--accent); }

.file-status {
  display: none;
  margin-top: 8px;
  padding: 8px 12px;
  border-radius: 12px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: .04em;
  line-height: 1.5;
  background: rgba(74,222,128,.08);
  border: 1px solid rgba(74,222,128,.25);
  color: var(--ok);
}
.file-status.show { display: block; animation: fadeIn .3s var(--ease-out); }
.file-status.error {
  background: rgba(248,113,113,.08);
  border-color: rgba(248,113,113,.25);
  color: var(--err);
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* =========================================================
   GATEWAY PICKER
   ========================================================= */
.gw-picker {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
  margin-top: 4px;
}
.gw-opt {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px;
  border: 1px solid rgba(255,255,255,.08);
  background: rgba(255,255,255,.045);
  color: var(--bg);
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  border-radius: 999px;
  cursor: pointer;
  user-select: none;
  transition: background .18s var(--ease), color .18s var(--ease), border-color .18s var(--ease);
  text-align: center;
  min-height: 42px;
  position: relative;
}
.gw-opt input { position: absolute; opacity: 0; pointer-events: none; }
.gw-opt.checked {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  box-shadow: 0 4px 12px rgba(255,77,0,.25);
}
.gw-opt:hover:not(.checked) { background: rgba(255,255,255,.08); }

/* =========================================================
   TERMS
   ========================================================= */
.terms {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  cursor: pointer;
  user-select: none;
  padding: 11px 14px;
  border: 1px solid rgba(255,255,255,.06);
  background: rgba(255,255,255,.03);
  border-radius: 18px;
  transition: border-color .2s var(--ease), background .2s var(--ease);
  margin-top: 2px;
}
.terms input { position: absolute; opacity: 0; pointer-events: none; }
.terms__box {
  width: 20px;
  height: 20px;
  border-radius: 6px;
  border: 2px solid rgba(244,241,232,.35);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background .18s var(--ease), border-color .18s var(--ease);
  margin-top: 1px;
}
.terms__box svg {
  width: 12px; height: 12px;
  stroke: #fff;
  stroke-width: 3;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0;
  transform: scale(.5);
  transition: opacity .18s, transform .18s var(--ease-out);
}
.terms input:checked + .terms__box { background: var(--accent); border-color: var(--accent); }
.terms input:checked + .terms__box svg { opacity: 1; transform: scale(1); }
.terms input:focus-visible + .terms__box { box-shadow: 0 0 0 4px rgba(255,77,0,.25); }
.terms__text {
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: .02em;
  line-height: 1.6;
  color: rgba(244,241,232,.65);
}
.terms__text a {
  color: var(--accent-2);
  border-bottom: 1px solid transparent;
  transition: border-color .2s var(--ease);
}
.terms__text a:hover { border-bottom-color: var(--accent-2); }
.terms.error { border-color: rgba(255,77,0,.5); background: rgba(255,77,0,.06); }
.terms.error .terms__box { border-color: var(--accent); }

/* =========================================================
   CTA
   ========================================================= */
.cta {
  position: relative;
  display: block;
  width: 100%;
  min-height: 56px;
  border-radius: 999px;
  padding: 2px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 50%, var(--accent) 100%);
  margin-top: 2px;
  cursor: pointer;
  transition: transform .2s var(--ease), opacity .2s var(--ease);
  touch-action: manipulation;
  border: 0;
}
.cta:hover:not(:disabled) { transform: translateY(-2px); }
.cta:active:not(:disabled) { transform: translateY(0); }
.cta:disabled { opacity: .55; cursor: not-allowed; }
.cta__inner {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  min-height: 52px;
  border-radius: 999px;
  background: var(--ink);
  color: var(--bg);
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  transition: background .25s var(--ease), color .25s var(--ease);
}
.cta:hover:not(:disabled) .cta__inner { background: transparent; color: #fff; }
.cta__inner svg {
  width: 18px; height: 18px;
  stroke: currentColor;
  stroke-width: 2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: transform .25s var(--ease);
  flex-shrink: 0;
}
.cta:hover:not(:disabled) .cta__inner svg { transform: translateX(3px); }

/* =========================================================
   TERMINAL
   ========================================================= */
.terminal-col { width: 100%; min-width: 0; }

.terminal {
  display: flex;
  flex-direction: column;
  background: var(--ink-2);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow:
    0 30px 80px -30px rgba(0,0,0,.6),
    inset 0 1px 0 rgba(255,255,255,.04);
  height: clamp(360px, 55vh, 560px);
}
@media (min-width: 1024px) {
  .terminal {
    flex: 1 1 auto;
    height: auto;
    min-height: 0;
    max-height: none;
  }
}

.term-bar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid rgba(255,255,255,.06);
  background: rgba(0,0,0,.5);
  font-family: var(--font-mono);
  font-size: 11px;
  color: rgba(244,241,232,.65);
}
.term-bar__dots { display: flex; gap: 6px; flex-shrink: 0; }
.term-bar__dot { width: 11px; height: 11px; border-radius: 50%; }
.term-bar__dot--r { background: #FF5F56; }
.term-bar__dot--y { background: #FFBD2E; }
.term-bar__dot--g { background: #27C93F; }
.term-bar__title {
  flex: 1;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.term-bar__title strong { color: var(--accent); font-weight: 600; }
.term-bar__meta {
  font-size: 10px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: rgba(244,241,232,.5);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 6px;
}
.term-bar__meta::before {
  content: "";
  width: 6px; height: 6px;
  border-radius: 50%;
  background: rgba(244,241,232,.4);
  flex-shrink: 0;
}
.term-bar__meta.idle::before { background: rgba(244,241,232,.4); }
.term-bar__meta.running { color: var(--accent); }
.term-bar__meta.running::before { background: var(--accent); animation: pulse 1s infinite; }
.term-bar__meta.done { color: var(--ok); }
.term-bar__meta.done::before { background: var(--ok); }
.term-bar__meta.err { color: var(--err); }
.term-bar__meta.err::before { background: var(--err); }

.term-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 16px 20px 22px;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.65;
  color: var(--bg);
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}
.term-body::-webkit-scrollbar { width: 6px; }
.term-body::-webkit-scrollbar-track { background: transparent; }
.term-body::-webkit-scrollbar-thumb { background: rgba(244,241,232,.15); border-radius: 3px; }
.term-body::-webkit-scrollbar-thumb:hover { background: rgba(244,241,232,.3); }

.tl {
  display: flex;
  gap: 10px;
  white-space: pre-wrap;
  word-break: break-word;
  animation: tlIn .18s var(--ease-out);
}
@keyframes tlIn {
  from { opacity: 0; transform: translateY(3px); }
  to   { opacity: 1; transform: translateY(0); }
}
.tl__t { color: rgba(244,241,232,.3); flex-shrink: 0; user-select: none; font-size: .88em; }
.tl__m { flex: 1; min-width: 0; }

.tl--head .tl__m { color: var(--accent); font-weight: 700; letter-spacing: .04em; }
.tl--head .tl__m::before { content: "▸ "; color: var(--accent); }
.tl--fn .tl__m { color: var(--accent-2); }
.tl--fn .tl__m::before { content: "> "; color: var(--accent-2); font-weight: 700; }
.tl--ret .tl__m { color: var(--bg); }
.tl--ret .tl__m::before { content: "← "; color: rgba(244,241,232,.4); font-weight: 700; }
.tl--ok .tl__m { color: var(--ok); }
.tl--ok .tl__m::before { content: "✓ "; font-weight: 700; }
.tl--err .tl__m { color: var(--err); }
.tl--err .tl__m::before { content: "✗ "; font-weight: 700; }
.tl--warn .tl__m { color: var(--warn); }
.tl--warn .tl__m::before { content: "! "; font-weight: 700; }
.tl--info .tl__m { color: rgba(244,241,232,.65); }
.tl--dim  .tl__m { color: rgba(244,241,232,.3); }

.term-cursor {
  display: inline-block;
  width: 7px; height: 1em;
  background: var(--accent);
  margin-left: 2px;
  vertical-align: -2px;
  animation: blink 1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

.term-placeholder {
  color: rgba(244,241,232,.5);
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.8;
  padding: 4px 0;
}
.term-placeholder p { margin: 0; }
.term-placeholder .green { color: var(--ok); }
.term-placeholder .cyan  { color: var(--accent-2); }
.term-placeholder .dim   { color: rgba(244,241,232,.3); }
.term-placeholder .accent { color: var(--accent); font-weight: 600; }

.term-banner {
  color: var(--accent);
  font-size: 10px;
  line-height: 1.15;
  margin-bottom: 12px;
  white-space: pre;
  overflow-x: auto;
  scrollbar-width: none;
  font-weight: 700;
}
.term-banner::-webkit-scrollbar { display: none; }

/* =========================================================
   LOGOUT MODAL
   ========================================================= */
.modal {
  position: fixed;
  inset: 0;
  z-index: 500;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal.open { display: flex; }

.modal__backdrop {
  position: absolute;
  inset: 0;
  background: rgba(10,10,10,.65);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  animation: fadeBackdrop .25s var(--ease-out);
}
@keyframes fadeBackdrop { from { opacity: 0; } to { opacity: 1; } }

.modal__card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 400px;
  background: var(--bg);
  color: var(--ink);
  border-radius: var(--radius-lg);
  padding: clamp(22px, 3vw, 32px);
  box-shadow:
    0 30px 80px -30px rgba(0,0,0,.5),
    0 4px 16px -4px rgba(0,0,0,.2);
  animation: cardPop .35s var(--ease-out);
  text-align: center;
}
@keyframes cardPop {
  from { opacity: 0; transform: translateY(20px) scale(.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.modal__icon {
  width: 56px; height: 56px;
  margin: 0 auto 18px;
  border-radius: 50%;
  background: rgba(255,77,0,.1);
  border: 1.5px solid rgba(255,77,0,.25);
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
}
.modal__icon svg {
  width: 26px; height: 26px;
  stroke: currentColor;
  stroke-width: 2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.modal__title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(20px, 2vw + 12px, 24px);
  letter-spacing: -0.02em;
  line-height: 1.15;
  margin: 0 0 8px;
  color: var(--ink);
}
.modal__desc {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: .02em;
  color: var(--muted);
  line-height: 1.55;
  margin: 0 0 24px;
}
.modal__actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.modal__btn {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 48px;
  padding: 10px 16px;
  border-radius: 999px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  transition: background .18s var(--ease), color .18s var(--ease), border-color .18s var(--ease), transform .15s var(--ease);
  -webkit-tap-highlight-color: transparent;
  border: 1.5px solid transparent;
}
.modal__btn:active { transform: scale(.97); }
.modal__btn--ghost {
  background: transparent;
  color: var(--ink);
  border-color: rgba(17,17,17,.15);
}
.modal__btn--ghost:hover {
  background: rgba(17,17,17,.06);
  border-color: rgba(17,17,17,.3);
}
.modal__btn--danger {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  box-shadow: 0 4px 14px rgba(255,77,0,.25);
}
.modal__btn--danger:hover { background: #e64500; border-color: #e64500; }

/* =========================================================
   SHORT VIEWPORTS
   ========================================================= */
@media (min-width: 1024px) and (max-height: 720px) {
  .form__scroll { padding: 14px 18px; gap: 10px; }
  .field__wrap { min-height: 46px; padding: 0 16px; }
  .field__input { padding: 11px 0; font-size: 14px; }
  .seg { min-height: 44px; padding: 3px; }
  .seg__opt { min-height: 38px; padding: 6px 10px; font-size: 10px; }
  .count { min-height: 46px; padding: 3px; }
  .count__btn { width: 40px; height: 40px; font-size: 18px; }
  .count__val { font-size: 16px; }
  .bulk-row .field__wrap { min-height: 42px; padding: 0 12px; }
  .bulk-row__del { width: 42px; }
  .btn-mini { min-height: 38px; font-size: 9px; padding: 6px 10px; }
  .gw-opt { min-height: 38px; padding: 8px; font-size: 9px; }
  .terms { padding: 9px 12px; }
  .terms__text { font-size: 10px; }
  .cta { min-height: 50px; }
  .cta__inner { min-height: 46px; font-size: 12px; }
}

@media (max-height: 500px) and (orientation: landscape) {
  .terminal { height: clamp(240px, 70vh, 400px); }
}

/* =========================================================
   MOBILE
   ========================================================= */
@media (max-width: 640px) {
  .form__scroll { padding: 14px 14px 18px; gap: 12px; }

  .field__wrap { min-height: 50px; padding: 0 16px; }
  .field__icon { width: 17px; height: 17px; margin-right: 9px; }
  .field__prefix { font-size: 13.5px; margin-right: 7px; }
  .field__input { padding: 13px 0; font-size: 16px; }

  .seg { min-height: 48px; padding: 3px; }
  .seg__opt { min-height: 42px; padding: 8px 12px; font-size: 10.5px; }
  .count { min-height: 50px; padding: 3px; }
  .count__btn { width: 44px; height: 44px; font-size: 19px; }
  .count__val { font-size: 17px; }

  .bulk-row .field__wrap { min-height: 46px; padding: 0 13px; }
  .bulk-row__del { width: 46px; }
  .btn-mini { min-height: 42px; font-size: 9.5px; padding: 8px 10px; }

  .gw-picker { grid-template-columns: 1fr 1fr; gap: 6px; }
  .gw-opt { min-height: 42px; font-size: 9.5px; padding: 10px 8px; }

  .terms { padding: 11px 13px; border-radius: 16px; gap: 10px; }
  .terms__text { font-size: 10px; }

  .cta { min-height: 54px; }
  .cta__inner { min-height: 50px; font-size: 12px; gap: 8px; }
  .cta__inner svg { width: 16px; height: 16px; }

  .terminal { border-radius: 18px; height: clamp(320px, 50vh, 460px); }
  .term-bar { padding: 10px 12px; gap: 10px; font-size: 10px; }
  .term-bar__dot { width: 9px; height: 9px; }
  .term-bar__title { font-size: 10px; }
  .term-bar__meta { font-size: 9px; }
  .term-body { font-size: 11px; padding: 14px 14px 20px; }
  .term-banner { font-size: 7.5px; margin-bottom: 10px; }
  .tl { gap: 8px; }
  .tl__t { font-size: .82em; }
}

@media (max-width: 420px) {
  .bulk-actions { grid-template-columns: 1fr; }
  .gw-picker { grid-template-columns: 1fr; }
  .modal__actions { grid-template-columns: 1fr; }
  .term-banner { font-size: 7px; }
  .nav__logout { padding: 6px 9px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    transition-duration: .001ms !important;
  }
  html { scroll-behavior: auto; }
}
</style>
</head>
<body>

<header class="nav">
  <div class="nav__inner">
    <a class="logo" href="/" aria-label="SMS Adda">
      <span class="logo__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M3 12c0-5 4-9 9-9s9 4 9 9-4 9-9 9-9-4-9-9zm4.5 0a4.5 4.5 0 0 0 9 0 4.5 4.5 0 0 0-9 0z"/>
        </svg>
      </span>
      <span class="logo__text">SMS<em>ADDA</em></span>
    </a>

    <span class="nav__divider" aria-hidden="true"></span>
    <span class="nav__page">~/send</span>

    <div class="nav__spacer"></div>

    <span class="status-pill" id="statusPill" role="status" aria-live="polite">
      <span class="label">IDLE</span>
    </span>

    <button type="button" class="nav__logout" id="logoutBtn" title="Log out">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span class="label">Logout</span>
    </button>
  </div>
</header>

<main class="workspace">
  <div class="workspace__inner">

    <div class="form-col">
      <form class="form" id="sendForm" novalidate autocomplete="on">
        <div class="form__scroll">

          <div class="field">
            <label class="field__label">Send mode</label>
            <div class="seg" role="radiogroup" aria-label="Send mode">
              <label class="seg__opt checked" data-mode="single">
                <input type="radio" name="sendMode" value="single" checked />
                <span>Single</span>
              </label>
              <label class="seg__opt" data-mode="bulk">
                <input type="radio" name="sendMode" value="bulk" />
                <span>Bulk</span>
              </label>
            </div>
          </div>

          <div id="singlePane">
            <div class="field">
              <label class="field__label" for="phone">Nepal phone number</label>
              <div class="field__wrap" id="phoneRow">
                <span class="field__icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <rect x="5" y="2" width="14" height="20" rx="2"/>
                    <line x1="12" y1="18" x2="12.01" y2="18"/>
                  </svg>
                </span>
                <span class="field__prefix">+977</span>
                <input
                  type="tel"
                  id="phone"
                  class="field__input"
                  placeholder="98XXXXXXXX"
                  inputmode="numeric"
                  pattern="[0-9]*"
                  autocomplete="tel-national"
                  maxlength="10"
                  spellcheck="false"
                  autocorrect="off"
                  autocapitalize="off"
                />
              </div>
              <p class="field__error" id="phoneError">Enter a valid 10-digit number starting with 98 or 97</p>
            </div>
          </div>

          <div id="bulkPane" hidden>
            <div class="field">
              <label class="field__label">Phone numbers (bulk)</label>
              <div class="bulk-list" id="numbersList"></div>
              <div class="bulk-actions">
                <button type="button" class="btn-mini" id="addNumberBtn">+ Add number</button>
                <button type="button" class="btn-mini" id="clearNumbersBtn">Clear all</button>
                <button type="button" class="btn-mini btn-mini--full" id="uploadBtn">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                  </svg>
                  Upload .txt (one number per line)
                </button>
                <input type="file" id="fileInput" class="file-input-hidden" accept=".txt,text/plain" />
              </div>
              <p class="bulk-count" id="numCount">0 numbers · <strong>0 valid</strong> · max 50</p>
              <div class="file-status" id="fileStatus"></div>
              <p class="field__error" id="bulkError">Add at least one valid number</p>
            </div>
          </div>

          <div class="field">
            <label class="field__label" for="count" id="countLabel">Messages per number</label>
            <div class="count" id="countWrap">
              <button type="button" class="count__btn" id="countMinus" aria-label="Decrease">−</button>
              <div class="count__val" id="countVal" aria-live="polite">1</div>
              <button type="button" class="count__btn" id="countPlus" aria-label="Increase">+</button>
            </div>
          </div>

                <span>Auto</span>

              <label class="seg__opt" data-gw="manual">
                <input type="radio" name="gwMode" value="manual" />
                <span>Manual</span>

          </div>

          <div class="field" id="gwField" hidden>
            <label class="field__label">Pick gateways</label>
            <div class="gw-picker" id="gwPicker">
              <label class="gw-opt"><input type="checkbox" value="clamphook" /><span>Clamphook</span></label>
              <label class="gw-opt"><input type="checkbox" value="ambition" /><span>Ambition</span></label>
              <label class="gw-opt"><input type="checkbox" value="merodoctor" /><span>MeroDoctor</span></label>
              <label class="gw-opt"><input type="checkbox" value="collegeinfo" /><span>CollegeInfo</span></label>
              <label class="gw-opt"><input type="checkbox" value="pariksha" /><span>Pariksha</span></label>
              <label class="gw-opt"><input type="checkbox" value="quickconnect" /><span>QuickConnect</span></label>

            </span>
            <span class="terms__text">
              I agree to the <a href="/terms.html" target="_blank" rel="noopener">Terms</a>
              and <a href="/privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.
            </span>
          </label>
          <p class="field__error" id="termsError" style="margin-left:20px;margin-top:-6px">You must agree to continue</p>

          <button type="submit" class="cta" id="sendBtn">
            <span class="cta__inner" id="ctaInner">
              <span>Send OTP</span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h14M12 5l7 7-7 7"/>
              </svg>
            </span>
          </button>

        </div>
      </form>
    </div>

    <div class="terminal-col" id="terminalCol">
      <div class="terminal">
        <div class="term-bar">
          <div class="term-bar__dots">
            <span class="term-bar__dot term-bar__dot--r"></span>
            <span class="term-bar__dot term-bar__dot--y"></span>
            <span class="term-bar__dot term-bar__dot--g"></span>
          </div>
          <div class="term-bar__title">SMS Adda <strong>~/send</strong> — live trace</div>
          <div class="term-bar__meta idle" id="termMeta">idle</div>
        </div>
        <div class="term-body" id="termBody" role="log" aria-live="polite"></div>

    </div>

  </div>
</main>

<div class="modal" id="logoutModal" role="dialog" aria-modal="true" aria-labelledby="logoutTitle">

  <div class="modal__card">

      <svg viewBox="0 0 24 24">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </div>
    <h2 class="modal__title" id="logoutTitle">Log out?</h2>
    <p class="modal__desc">You'll need to sign in again to send OTPs.</p>
    <div class="modal__actions">
      <button type="button" class="modal__btn modal__btn--ghost" id="cancelLogout">Cancel</button>
      <button type="button" class="modal__btn modal__btn--danger" id="confirmLogout">Log out</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* LOGOUT MODAL */
  var logoutModal    = document.getElementById("logoutModal");
  var logoutBtn      = document.getElementById("logoutBtn");
  var cancelLogout   = document.getElementById("cancelLogout");
  var confirmLogout  = document.getElementById("confirmLogout");
  var logoutBackdrop = document.getElementById("logoutBackdrop");

  function openLogoutModal() {
    logoutModal.classList.add("open");
    document.body.classList.add("modal-open");
    setTimeout(function () { confirmLogout.focus(); }, 60);
  }
  function closeLogoutModal() {
    logoutModal.classList.remove("open");
    document.body.classList.remove("modal-open");
    logoutBtn.focus();
  }

  logoutBtn.addEventListener("click", openLogoutModal);
  cancelLogout.addEventListener("click", closeLogoutModal);
  logoutBackdrop.addEventListener("click", closeLogoutModal);
  confirmLogout.addEventListener("click", function () {
    try { localStorage.removeItem("smsadda_user"); } catch (e) {}
    window.location.replace("/login.html");
  });

  document.addEventListener("keydown", function (e) {
    if (!logoutModal.classList.contains("open")) return;
    if (e.key === "Escape") { closeLogoutModal(); return; }
    if (e.key === "Tab") {
      var focusable = logoutModal.querySelectorAll("button, [href], [tabindex]:not([tabindex='-1'])");
      if (!focusable.length) return;
      var first = focusable[0];
      var last  = focusable[focusable.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault(); last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault(); first.focus();
      }
    }
  });

  /* CONFIG */
  var WORKER_URL = "https://smsbomber.ethical-laxman.workers.dev/";
  var GATEWAYS = [
    { id: "clamphook",   label: "Clamphook",   slug: "clamphook.com" },
    { id: "ambition",    label: "Ambition",    slug: "ambition.guru" },
    { id: "merodoctor",  label: "MeroDoctor",  slug: "merodoctor.com" },
    { id: "collegeinfo", label: "CollegeInfo", slug: "collegeinfonepal.com" },
    { id: "pariksha",    label: "Pariksha",    slug: "pariksha.solutions" },
    { id: "quickconnect",label: "QuickConnect",slug: "quickconnect.biz" }
  ];
  var SPEED = 1.0;
  var T = {
    line:     Math.round(240 / SPEED),
    fn:       Math.round(360 / SPEED),
    ret:      Math.round(420 / SPEED),
    step:     Math.round(520 / SPEED),
    pulse:    Math.round(600 / SPEED),
    perPhone: Math.round(220 / SPEED)
  };
  var MAX_BULK = 50;
  var MAX_COUNT_SINGLE = 10;
  var MAX_COUNT_BULK = 5;

  /* DOM */
  var form            = document.getElementById("sendForm");
  var singlePane      = document.getElementById("singlePane");
  var bulkPane        = document.getElementById("bulkPane");
  var phoneInput      = document.getElementById("phone");
  var phoneRow        = document.getElementById("phoneRow");
  var phoneError      = document.getElementById("phoneError");

  var numbersList     = document.getElementById("numbersList");
  var addNumberBtn    = document.getElementById("addNumberBtn");
  var clearNumbersBtn = document.getElementById("clearNumbersBtn");
  var uploadBtn       = document.getElementById("uploadBtn");
  var fileInput       = document.getElementById("fileInput");
  var fileStatus      = document.getElementById("fileStatus");
  var numCount        = document.getElementById("numCount");
  var bulkError       = document.getElementById("bulkError");

  var countMinus      = document.getElementById("countMinus");
  var countPlus       = document.getElementById("countPlus");
  var countVal        = document.getElementById("countVal");
  var countLabel      = document.getElementById("countLabel");

  var gwField         = document.getElementById("gwField");
  var gwPicker        = document.getElementById("gwPicker");
  var gwError         = document.getElementById("gwError");

  var terms           = document.getElementById("terms");
  var termsCheck      = document.getElementById("termsCheck");
  var termsError      = document.getElementById("termsError");

  var sendBtn         = document.getElementById("sendBtn");
  var ctaInner        = document.getElementById("ctaInner");
  var termMeta        = document.getElementById("termMeta");
  var termBody        = document.getElementById("termBody");
  var statusPill      = document.getElementById("statusPill");
  var terminalCol     = document.getElementById("terminalCol");

  /* STATE */
  var state = { sendMode: "single", gwMode: "auto", count: 1 };
  var bulkNumbers = [];
  var isSending = false;

  /* UTILS */
  function isValidNepaliPhone(v) { return /^(98|97)\d{8}$/.test(v); }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function pad(n, w) { n = String(n); while (n.length < w) n = "0" + n; return n; }
  function nowStamp() {
    var d = new Date();
    return pad(d.getHours(), 2) + ":" + pad(d.getMinutes(), 2) + ":" + pad(d.getSeconds(), 2);
  }

  function scrollToTerminalIfMobile() {
    if (window.matchMedia("(max-width: 1023px)").matches) {
      requestAnimationFrame(function () {
        setTimeout(function () {
          terminalCol.scrollIntoView({ behavior: "smooth", block: "start" });
        }, 80);
      });
    }
  }

  /* TERMINAL WRITER */
  function termLine(text, kind) {
    var line = document.createElement("div");
    line.className = "tl" + (kind ? " tl--" + kind : "");
    var t = document.createElement("span");
    t.className = "tl__t";
    t.textContent = nowStamp();
    var m = document.createElement("span");
    m.className = "tl__m";
    m.textContent = text;
    line.appendChild(t);
    line.appendChild(m);
    termBody.appendChild(line);
    termBody.scrollTop = termBody.scrollHeight;
  }

  async function typeLine(text, kind, ms) {
    var line = document.createElement("div");
    line.className = "tl" + (kind ? " tl--" + kind : "");
    var t = document.createElement("span");
    t.className = "tl__t";
    t.textContent = nowStamp();
    var m = document.createElement("span");
    m.className = "tl__m";
    m.textContent = "";
    line.appendChild(t);
    line.appendChild(m);
    termBody.appendChild(line);
    var speed = ms || 14;
    for (var i = 0; i < text.length; i++) {
      m.textContent += text[i];
      if (i % 3 === 0) termBody.scrollTop = termBody.scrollHeight;
      await sleep(speed);
    }
    termBody.scrollTop = termBody.scrollHeight;
  }

  function clearTerm() { termBody.innerHTML = ""; }

  function showBanner() {
    var banner = document.createElement("pre");
    banner.className = "term-banner";
    banner.textContent =
      "  ███████╗███╗   ███╗███████╗     █████╗ ██████╗ ██████╗  █████╗ \n" +
      "  ██╔════╝████╗ ████║██╔════╝    ██╔══██╗██╔══██╗██╔══██╗██╔══██╗\n" +
      "  ███████╗██╔████╔██║███████╗    ███████║██║  ██║██║  ██║███████║\n" +
      "  ╚════██║██║╚██╔╝██║╚════██║    ██╔══██║██║  ██║██║  ██║██╔══██║\n" +
      "  ███████║██║ ╚═╝ ██║███████║    ██║  ██║██████╔╝██████╔╝██║  ██║\n" +
      "  ╚══════╝╚═╝     ╚═╝╚══════╝    ╚═╝  ╚═╝╚═════╝ ╚═════╝ ╚═╝  ╚═╝";
    termBody.appendChild(banner);

    var info = document.createElement("div");
    info.className = "term-placeholder";
    info.innerHTML =
      '<p class="dim">backend trace · v1.0</p>' +
      '<p class="dim">worker: <span class="cyan">' + WORKER_URL + '</span></p>' +
      '<p class="dim">─────────────────────────────────────</p>' +
      '<p><span class="green">✓</span> worker online</p>' +
      '<p><span class="green">✓</span> gateways ready</p>' +
      '<p><span class="green">✓</span> rate limiter active</p>' +
      '<p><span class="accent">○</span> waiting for send event<span class="term-cursor"></span></p>';
    termBody.appendChild(info);
  }

  function setTermMeta(kind, text) {
    termMeta.className = "term-bar__meta" + (kind ? " " + kind : " idle");
    termMeta.textContent = text;
  }
  function setStatusPill(mode, text) {
    statusPill.classList.remove("running", "ok", "err");
    if (mode) statusPill.classList.add(mode);
    var label = statusPill.querySelector(".label");
    if (label) label.textContent = text;
    else statusPill.textContent = text;
  }
  function setFileStatus(msg, isError) {
    fileStatus.textContent = msg;
    fileStatus.classList.toggle("error", !!isError);
    fileStatus.classList.add("show");
    clearTimeout(setFileStatus._t);
    setFileStatus._t = setTimeout(function () {
      fileStatus.classList.remove("show");
    }, 6000);
  }

  /* MODE TOGGLES */
  function setSendMode(val) {
    if (val === state.sendMode) return;
    state.sendMode = val;
    document.querySelectorAll('[data-mode]').forEach(function (l) {
      var isThis = l.getAttribute("data-mode") === val;
      l.classList.toggle("checked", isThis);
      var inp = l.querySelector("input");
      if (inp) inp.checked = isThis;
    });
    singlePane.hidden = (val !== "single");
    bulkPane.hidden   = (val !== "bulk");
    if (val === "bulk") syncBulkFromDOM();
    var cap = (val === "bulk") ? MAX_COUNT_BULK : MAX_COUNT_SINGLE;
    if (state.count > cap) state.count = cap;
    updateCount();
    updateNumCount();
  }
  document.querySelectorAll('[data-mode]').forEach(function (label) {
    label.addEventListener("click", function () {
      setSendMode(label.getAttribute("data-mode"));
    });
  });

  function setGatewayMode(val) {
    state.gwMode = val;
    document.querySelectorAll('[data-gw]').forEach(function (l) {
      var isThis = l.getAttribute("data-gw") === val;
      l.classList.toggle("checked", isThis);
      var inp = l.querySelector("input");
      if (inp) inp.checked = isThis;
    });

    if (val === "auto") {
      gwField.hidden = true;
      gwError.classList.remove("show");
      gwPicker.querySelectorAll('input[type="checkbox"]').forEach(function (cb) {
        cb.checked = false;
        cb.closest(".gw-opt").classList.remove("checked");
      });
    } else {
      gwField.hidden = false;
    }
  }
  document.querySelectorAll('[data-gw]').forEach(function (label) {
    label.addEventListener("click", function () {
      setGatewayMode(label.getAttribute("data-gw"));
    });
  });

  gwPicker.querySelectorAll('input[type="checkbox"]').forEach(function (cb) {
    cb.addEventListener("change", function () {
      cb.closest(".gw-opt").classList.toggle("checked", cb.checked);
      var any = gwPicker.querySelectorAll('input:checked').length > 0;
      gwError.classList.toggle("show", !any);
    });
  });

  /* BULK */
  function createNumberRow(value) {
    var row = document.createElement("div");
    row.className = "bulk-row";
    row.innerHTML =
      '<div class="field__wrap">' +
        '<span class="field__prefix">+977</span>' +
        '<input type="tel" class="field__input" placeholder="98XXXXXXXX" inputmode="numeric" pattern="[0-9]*" maxlength="10" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />' +
      '</div>' +
      '<button type="button" class="bulk-row__del" aria-label="Remove">×</button>';
    var input = row.querySelector("input");
    var del = row.querySelector(".bulk-row__del");

    input.value = value || "";
    input.addEventListener("input", function () {
      this.value = this.value.replace(/\D/g, "").slice(0, 10);
      row.classList.toggle("invalid",
        this.value.length === 10 && !isValidNepaliPhone(this.value));
      syncBulkFromDOM();
    });
    input.addEventListener("keydown", function (e) {
      if (["e","E","+","-",".",","].indexOf(e.key) !== -1) e.preventDefault();
    });
    del.addEventListener("click", function () {
      row.remove();
      syncBulkFromDOM();
    });
    numbersList.appendChild(row);
    return row;
  }

  function syncBulkFromDOM() {
    bulkNumbers = Array.prototype.slice.call(
      numbersList.querySelectorAll('input[type="tel"]')
    ).map(function (i) { return i.value.replace(/\D/g, ""); }).filter(Boolean);
    updateNumCount();
  }

  function updateNumCount() {
    var total = numbersList.querySelectorAll(".bulk-row").length;
    var valid = bulkNumbers.filter(isValidNepaliPhone).length;
    numCount.innerHTML = total + " number" + (total !== 1 ? "s" : "") +
      " · <strong>" + valid + " valid</strong> · max " + MAX_BULK;
    clearNumbersBtn.disabled = total === 0 || isSending;
    addNumberBtn.disabled = total >= MAX_BULK || isSending;
    uploadBtn.disabled = total >= MAX_BULK || isSending;
    if (state.sendMode === "bulk" && total > 0 && valid === 0) {
      bulkError.classList.add("show");
    } else {
      bulkError.classList.remove("show");
    }
  }

  addNumberBtn.addEventListener("click", function () {
    if (numbersList.querySelectorAll(".bulk-row").length >= MAX_BULK) return;
    var row = createNumberRow("");
    row.querySelector("input").focus();
    syncBulkFromDOM();
  });

  clearNumbersBtn.addEventListener("click", function () {
    numbersList.innerHTML = "";
    bulkNumbers = [];
    updateNumCount();
  });

  uploadBtn.addEventListener("click", function () {
    if (uploadBtn.disabled) return;
    fileInput.click();
  });

  fileInput.addEventListener("change", function () {
    var file = fileInput.files && fileInput.files[0];
    if (!file) return;

    if (!/\.txt$/i.test(file.name) && file.type && file.type.indexOf("text") !== 0) {
      setFileStatus("Only .txt files are supported.", true);
      fileInput.value = "";
      return;
    }

    var reader = new FileReader();
    reader.onload = function (e) {
      var text = String(e.target.result || "");
      parseBulkFile(text, file.name);
      fileInput.value = "";
    };
    reader.onerror = function () {
      setFileStatus("Could not read the file. Try again.", true);
      fileInput.value = "";
    };
    reader.readAsText(file, "UTF-8");
  });

  function parseBulkFile(text, filename) {
    var lines = text.split(/\r\n|\r|\n/);

    var existing = {};
    numbersList.querySelectorAll('input[type="tel"]').forEach(function (inp) {
      var v = inp.value.replace(/\D/g, "");
      if (v) existing[v] = true;
    });

    var parsed = [];
    var skipped = 0;
    var duplicates = 0;

    for (var i = 0; i < lines.length; i++) {
      var raw = String(lines[i] || "").trim();
      if (!raw) continue;

      var digits = raw.replace(/\D/g, "");
      if (digits.startsWith("977")) digits = digits.slice(3);
      if (digits.length > 10) digits = digits.slice(-10);

      if (!isValidNepaliPhone(digits)) { skipped++; continue; }
      if (existing[digits]) { duplicates++; continue; }

      existing[digits] = true;
      parsed.push(digits);
    }

    var currentCount = numbersList.querySelectorAll(".bulk-row").length;
    var space = MAX_BULK - currentCount;
    var added = 0;
    var truncated = 0;

    for (var k = 0; k < parsed.length; k++) {
      if (added >= space) { truncated++; continue; }
      createNumberRow(parsed[k]);
      added++;
    }

    syncBulkFromDOM();

    if (added === 0 && parsed.length === 0 && skipped === 0 && duplicates === 0) {
      setFileStatus("The file appears to be empty.", true);
      return;
    }

    var parts = [];
    if (added) parts.push("Added " + added);
    if (duplicates) parts.push(duplicates + " duplicate" + (duplicates > 1 ? "s" : "") + " skipped");
    if (skipped) parts.push(skipped + " invalid skipped");
    if (truncated) parts.push(truncated + " over limit");

    var msg = parts.join(" · ");
    if (filename) msg = filename + " — " + msg;

    setFileStatus(msg, added === 0);
  }

  /* COUNT */
  function maxCount() { return state.sendMode === "bulk" ? MAX_COUNT_BULK : MAX_COUNT_SINGLE; }
  function updateCount() {
    countVal.textContent = state.count;
    countMinus.disabled = state.count <= 1 || isSending;
    countPlus.disabled  = state.count >= maxCount() || isSending;
    countLabel.textContent = "Messages per number (max " + maxCount() + ")";
  }
  countMinus.addEventListener("click", function () {
    if (state.count > 1) { state.count--; updateCount(); }
  });
  countPlus.addEventListener("click", function () {
    if (state.count < maxCount()) { state.count++; updateCount(); }
  });

  /* PHONE */
  function validatePhone() {
    var ok = isValidNepaliPhone(phoneInput.value.replace(/\D/g, ""));
    phoneRow.classList.toggle("error", !ok);
    phoneError.classList.toggle("show", !ok);
    return ok;
  }
  phoneInput.addEventListener("input", function () {
    this.value = this.value.replace(/\D/g, "").slice(0, 10);
    if (this.value.length === 10) validatePhone();
    else { phoneRow.classList.remove("error"); phoneError.classList.remove("show"); }
  });
  phoneInput.addEventListener("keydown", function (e) {
    if (["e","E","+","-",".",","].indexOf(e.key) !== -1) e.preventDefault();
  });

  terms.addEventListener("change", function () {
    if (terms.checked) {
      termsCheck.classList.remove("error");
      termsError.classList.remove("show");
    }
  });

  /* DISABLE / ENABLE */
  function setControlsDisabled(disabled) {
    countMinus.disabled = disabled || state.count <= 1;
    countPlus.disabled = disabled || state.count >= maxCount();
    document.querySelectorAll('[data-mode], [data-gw]').forEach(function (l) {
      l.style.pointerEvents = disabled ? "none" : "";
      l.style.opacity = disabled ? "0.55" : "";
    });
    gwPicker.querySelectorAll('input').forEach(function (cb) { cb.disabled = disabled; });
    numbersList.querySelectorAll("input, button").forEach(function (el) { el.disabled = disabled; });
    addNumberBtn.disabled = disabled || numbersList.querySelectorAll(".bulk-row").length >= MAX_BULK;
    clearNumbersBtn.disabled = disabled || numbersList.querySelectorAll(".bulk-row").length === 0;
    uploadBtn.disabled = disabled || numbersList.querySelectorAll(".bulk-row").length >= MAX_BULK;
    phoneInput.disabled = disabled;
  }

  /* RUN FLOW */
  async function runFlow(phones, perNumber, gwMode, manualIds) {
    isSending = true;
    setControlsDisabled(true);
    sendBtn.disabled = true;
    ctaInner.innerHTML = '<span>Sending…</span>';
    setTermMeta("running", "running");
    setStatusPill("running", "RUNNING");

    scrollToTerminalIfMobile();
    clearTerm();
    showBanner();
    await sleep(400);

    await typeLine("[01/06] client.submit()", "head", 12);
    await sleep(T.line);
    termLine("  source = \"browser\"", "info");
    termLine("  target = \"" + WORKER_URL + "\"", "info");
    termLine("  phone_count = " + phones.length, "info");
    termLine("  messages_per_phone = " + perNumber, "info");
    termLine("  gateway_mode = \"" + gwMode + "\"", "info");
    if (gwMode === "manual") termLine("  manual_gateways = [" + manualIds.join(", ") + "]", "info");
    await sleep(T.step);

    await typeLine("fetch(WORKER_URL, { method: 'POST', body })", "fn");
    await sleep(T.fn);
    termLine("  → awaiting response…", "dim");
    await sleep(T.pulse);

    await typeLine("[02/06] worker.fetch(request, env)", "head", 12);
    await sleep(T.line);
    termLine("  request.method = \"POST\"", "info");
    termLine("  request.headers['content-type'] = \"application/json\"", "info");
    await sleep(T.step);

    await typeLine("body = await request.json()", "fn");
    await sleep(T.fn);
    termLine("body = { phone: ..., count: " + perNumber + ", gateway: \"" + gwMode + "\" }", "ret");
    await sleep(T.ret);

    await typeLine("[03/06] validatePhone(phone)", "head", 12);
    await sleep(T.line);
    for (var p = 0; p < phones.length; p++) {
      await typeLine("  validatePhone('" + phones[p] + "')", "fn", 10);
      await sleep(T.fn);
      termLine("  → ok  · +977" + phones[p], "ok");
      await sleep(T.perPhone);
    }
    termLine("  " + phones.length + " phone(s) validated", "ok");
    await sleep(T.step);

    await typeLine("[04/06] selectGateways(mode)", "head", 12);
    await sleep(T.line);

    var order;
    if (gwMode === "manual" && manualIds.length) {
      order = manualIds.map(function (id) {
        var idx = GATEWAYS.findIndex(function (g) { return g.id === id; });
        return idx >= 0 ? GATEWAYS[idx] : null;
      }).filter(Boolean);
      termLine("  mode = \"manual\"", "info");
      termLine("  candidates = [" + order.map(function (g) { return '"' + g.id + '"'; }).join(", ") + "]", "info");
    } else {
      order = GATEWAYS.slice().sort(function () { return Math.random() - 0.5; });
      termLine("  mode = \"auto\"", "info");
      termLine("  candidates = shuffled([" + order.map(function (g) { return '"' + g.id + '"'; }).join(", ") + "])", "info");
    }
    await sleep(T.step);

    if (order.length === 0) {
      termLine("  ✗ no gateways available", "err");
      await finishFlow(false, phones, perNumber);
      return;
    }

    await typeLine("[05/06] tryGateways(phone, candidates)", "head", 12);
    await sleep(T.line);

    var winner = null;
    for (var i = 0; i < order.length; i++) {
      var gw = order[i];
      termLine("", "dim");
      await typeLine("callGateway('" + gw.slug + "', phone)  // attempt " + (i + 1), "fn", 12);
      await sleep(T.fn);
      termLine("  → opening connection to " + gw.slug, "info");
      await sleep(T.pulse * 0.4);
      var success = (gwMode === "manual") ? true : (i >= 1);
      if (success) {
        termLine("  → response.status = 200", "info");
        termLine("  → body.success = true", "info");
        termLine("  → SMS dispatched to +977" + phones[0], "ret");
        termLine("gateway '" + gw.label + "' accepted the request", "ok");
        winner = gw;
        break;
      } else {
        termLine("  → response.status = 500", "info");
        termLine("  → body.success = false", "info");
        termLine("gateway '" + gw.label + "' rejected · rotating", "warn");
        await sleep(T.step);
      }
    }

    if (!winner) {
      termLine("", "dim");
      termLine("all candidates exhausted · no dispatch", "err");
      await finishFlow(false, phones, perNumber);
      return;
    }

    await typeLine("[06/06] delivery", "head", 12);
    await sleep(T.line);
    termLine("  winner = \"" + winner.label + "\"", "ret");
    termLine("  total_sms = " + (phones.length * perNumber), "info");
    await sleep(T.step);

    var sentCount = 0;
    var totalCount = phones.length * perNumber;
    for (var n = 0; n < phones.length; n++) {
      for (var k = 0; k < perNumber; k++) {
        await typeLine("  sendSMS('+977" + phones[n] + "')  [" + (sentCount + 1) + "/" + totalCount + "]", "fn", 8);
        await sleep(T.perPhone);
        termLine("  ✓ delivered to +977" + phones[n], "ok");
        sentCount++;
      }
    }

    await sleep(T.step);
    termLine("", "dim");
    termLine("────────────────────────────────────────────", "dim");
    termLine("flow complete · " + sentCount + " message(s) sent via " + winner.label, "ok");
    termLine("timestamp = " + new Date().toISOString(), "info");

    await finishFlow(true, phones, perNumber);
  }

  async function finishFlow(ok, phones, perNumber) {
    isSending = false;
    setControlsDisabled(false);
    sendBtn.disabled = false;
    ctaInner.innerHTML =
      '<span>Send OTP</span>' +
      '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>';
    updateCount();
    updateNumCount();
    if (ok) {
      setStatusPill("ok", "DELIVERED");
      setTermMeta("done", "complete");
    } else {
      setStatusPill("err", "FAILED");
      setTermMeta("err", "failed");
    }
  }

  /* SUBMIT */
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (isSending) return;

    var phones = [];
    if (state.sendMode === "single") {
      if (!validatePhone()) { phoneInput.focus(); return; }
      phones = [phoneInput.value.replace(/\D/g, "")];
    } else {
      syncBulkFromDOM();
      phones = bulkNumbers.filter(isValidNepaliPhone);
      if (phones.length === 0) { bulkError.classList.add("show"); return; }
      bulkError.classList.remove("show");
    }

    var manualIds = [];
    if (state.gwMode === "manual") {
      manualIds = Array.prototype.slice.call(
        gwPicker.querySelectorAll('input[type="checkbox"]:checked')
      ).map(function (cb) { return cb.value; });
      if (manualIds.length === 0) { gwError.classList.add("show"); return; }
    }

    if (!terms.checked) {
      termsCheck.classList.add("error");
      termsError.classList.add("show");
      return;
    }
    termsCheck.classList.remove("error");
    termsError.classList.remove("show");

    runFlow(phones, state.count, state.gwMode, manualIds);
  });

  /* INIT */
  createNumberRow("");
  syncBulkFromDOM();

  singlePane.hidden = false;
  bulkPane.hidden = true;
  gwField.hidden = true;

  updateCount();
  updateNumCount();
  showBanner();
  setStatusPill(null, "IDLE");

})();
</script>
</body>
</html>
